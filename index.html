/* ---- fee breakdown with illustrative comparison ---- */
function feePanel(x, fn, est){
  const c = COUNTRIES[x.country];
  if (!(x.send>0)) return `<div class="feepanel"><div class="small muted">Enter an amount to see the fee breakdown.</div></div>`;
  const variable = r2(x.fee - c.feeFlat);
  let cmp = '';
  const C = COMPARE[x.country];
  if (C){
    const rows = [{ name:'Nu', total:x.total, me:true }, ...C.map(p=>({ name:p.name, total: r2(ceil2(x.receive/(x.rate*(1-p.fx))) + p.fee) }))];
    const max = Math.max(...rows.map(r=>r.total));
    const app = rows.find(r=>r.name.includes('app'));
    cmp = `<div class="fee-h">${est?'Estimated cost':'What it costs'} for ${esc(fn)} to get ${fmtCur(x.receive,x.country)}</div>
      <div class="cmp">${rows.map(r=>`<div class="cmprow ${r.me?'me':''}"><div class="row" style="justify-content:space-between"><span>${r.name}</span><b class="num">${fmtUSD(r.total)}</b></div><div class="bar"><i style="width:${Math.max(8, r.total/max*100).toFixed(1)}%"></i></div></div>`).join('')}</div>
      ${app && app.total>x.total ? `<div class="small" style="color:var(--green);font-weight:600;margin-top:8px">About ${fmtUSD(r2(app.total-x.total))} less than a typical money transfer app</div>`:''}
      <div style="margin-top:8px"><span class="sim">Illustrative averages — not live quotes from named providers</span></div>`;
  } else cmp = `<div class="small muted" style="margin-top:10px">A price comparison isn’t available for ${c.name} yet.</div>`;
  return `<div class="feepanel">
    <div class="kv"><span class="k">Fixed fee</span><span class="v">${fmtUSD(c.feeFlat)}</span></div>
    <div class="kv"><span class="k">Variable fee · ${(c.feePct*100).toFixed(2)}%</span><span class="v">${fmtUSD(variable)}</span></div>
    <div class="kv"><span class="k">Rate used</span><span class="v">${fmtRate(x.rate,x.country)}</span></div>
    <div class="small muted" style="padding:6px 0 2px">That’s everything Nu charges for this transfer. ${esc(fn)} gets the full ${fmtCur(x.receive,x.country)}.</div>
    ${cmp}
  </div>`;
}

function lockTag(d){
  if (d.mode==='estimate' || d.mode==='ask' || !d.validUntil) return `<span class="tag gray lk">${I.unlock} Not locked</span>`;
  const mins = Math.max(0, Math.round((d.validUntil - S.now)/60000));
  return mins>0 ? `<span class="tag purple lk">${I.lock} Locked ${mins} min</span>` : `<span class="tag amber lk">${I.clock} Quote ended</span>`;
}
function rateSheet(){
  const d = S.draft; if (!d) return '';
  const c = COUNTRIES[d.country], fn = firstName(recipientName()), a = amounts(d);
  const locked = !(d.mode==='estimate' || d.mode==='ask' || !d.validUntil);
  const pts = (arr) => `<div class="stack" style="gap:10px;margin:14px 0 4px">${arr.map(([h,b])=>`<div class="row" style="align-items:flex-start;gap:10px"><span class="stepnum" style="width:24px;height:24px">${I.check.replace('<svg','<svg style="width:12px;height:12px"')}</span><div><div style="font-weight:600;font-size:15px">${h}</div><div class="small muted">${b}</div></div></div>`).join('')}</div>`;
  if (locked){
    const total = QUOTE_WINDOW_MIN*60000, left = Math.max(0, d.validUntil - S.now), pct = Math.round(left/total*100);
    return `<div class="ratehero">${I.lock}<div><div class="small muted">Your rate</div><div class="num" style="font-size:22px;font-weight:650">${fmtRate(d.rate,d.country)}</div></div></div>
      <h2>${left>0?`Locked until ${fmtTime(d.validUntil)}`:'This quote has ended'}</h2>
      <div class="holdbar"><i style="width:${pct}%"></i></div>
      <p style="margin-top:10px">${left>0?`Send before ${fmtTime(d.validUntil)} and this is the rate you get${a.receive?` — ${esc(fn)} receives exactly ${fmtCur(a.receive,d.country)}`:''}.`:`Rates have moved since this quote. We’ll show you a current one before you send.`}</p>
      ${pts([['The real exchange rate','This is the mid-market rate — the one banks use with each other and you see on Google. We don’t add a markup to it.'],['No hidden fees in the rate','You pay one fee, shown on its own. Many providers hide part of their charge in a worse rate.'],[`Locked for ${QUOTE_WINDOW_MIN} minutes`,'If the lock ends, we refresh the quote and show you the new numbers before you send.']])}
      <div style="text-align:center;margin:8px 0 4px"><span class="sim">Proposed pricing · illustrative ${QUOTE_WINDOW_MIN}-minute lock</span></div>
      <button class="btn secondary" data-act="sheetOff" style="margin-top:8px">Got it</button>`;
  }
  return `<div class="ratehero unl">${I.unlock}<div><div class="small muted">${d.mode==='ask'?'Today’s rate':'Today’s estimate'}</div><div class="num" style="font-size:22px;font-weight:650">≈ ${fmtRate(d.mode==='ask'?c.rate:d.rate,d.country)}</div></div></div>
    <h2>The rate isn’t locked yet</h2>
    <p>Nothing is locked or charged while you wait for ${esc(fn)}’s details. This estimate uses today’s mid-market rate, with no markup.</p>
    ${pts([[`When ${esc(fn)}’s details arrive`,`You get a current quote, locked for ${QUOTE_WINDOW_MIN} minutes while you review.`],['Your planned amount stays the same',`If ${esc(fn)} should get a set amount, we keep it and update what you pay.`],['Any change is shown up front','If the rate has moved, you’ll see the new numbers before you send. There’s no penalty for waiting.']])}
    <div style="text-align:center;margin:8px 0 4px"><span class="sim">Simulated rates</span></div>
    <button class="btn secondary" data-act="sheetOff" style="margin-top:8px">Got it</button>`;
}

function allContacts(){ return [...S.added, ...CONTACTS.recent, ...CONTACTS.saved]; }
function contactById(id){ return allContacts().find(x=>x.id===id); }
const trustKey = (name, cc) => name+'|'+cc;
function isTrusted(name, cc){ return !!S.trusted[trustKey(name, cc)]; }
function contactForDraft(d){ if (!d) return null; if (d.fromRequest && S.request){ const c = S.added.find(x=>x.reqId===S.request.id); if (c) return c; } return allContacts().find(x=>x.country===d.country && (x.name===d.name || (d.resolved && x.name===d.resolved.name))) || null; }
function trustedForDraft(d){ const c = contactForDraft(d); return !!(c && isTrusted(c.name, c.country)); }

function rScreen(){
  const r = S.request;
  if (!r) return 'none';
  if (r.status==='cancelled' || r.status==='expired' || r.status==='declined') return 'closed';
  if (r.status==='awaiting') return ['submitted','status'].includes(S.rcp.screen) ? 'invite' : S.rcp.screen;
  return (S.rcp.screen==='submitted' && r.status==='ready') ? 'submitted' : 'status';
}
function recipientScreen(){
  let h = (RECIP[rScreen()] || RECIP.none)();
  if (h.includes('class="webbar"')) h = h.replace('<div class="scr white', '<div class="scr white web') + browserbar();
  const n = S.rcp.notif;
  if (n && rScreen()==='none' && S.transfer && !S.transfer.fromRequest){ n.fresh=false; return h; }
  if (n){ h += `<div class="pushnote ${n.fresh?'fresh':''}"><div class="pn-ic">${esc(n.bank.slice(0,1))}</div><div style="flex:1;min-width:0"><div class="pn-h"><b>${esc(n.bank)}</b><span>now</span></div><div class="pn-t">${esc(n.msg)}</div></div></div>`; n.fresh=false; }
  return h;
}

status(){
  const r = S.request, t = S.transfer && S.transfer.id===r.transferId ? S.transfer : null;
  const bank = r.details.bank;
  let head, sub, tag, tagc='purple', steps;
  const step = (cls, s1, s2) => `<div class="step ${cls}"><div class="dot">${cls==='done'?I.check:cls==='warn'?I.clock:cls==='bad'?I.close:''}</div><div><div class="s1">${s1}</div>${s2?`<div class="s2">${s2}</div>`:''}</div></div>`;
  if (!t){ const em = r.channel==='email' ? S.rcp.updates!==false : isEmail(S.rcp.f.updEmail||''); head='You’re all set'; sub=`Your details are with Ana, ready for her to send. ${em?'We’ll email you':'This page updates'} the moment it’s on its way.`; tag='Ready to send'; tagc='green';

  else {
    const st = t.status;
    const base = step('done','You added your details',fmtDT(r.submittedAt)) + step('done','Ana sent the money',fmtDT(t.createdAt));
    if (st==='completed'){ head='Delivered'; sub=`${fmtCur(t.receive,t.country)} arrived in your ${esc(bank)} account.`; tag='Delivered'; tagc='green';
      steps = base + step('done','On its way','') + step('done','Delivered to '+esc(bank), fmtDT(t.completedAt)); }

      steps = base + step('bad','Returned by '+esc(bank), fmtDT(t.returnedAt)); }
    else if (st==='uncertain'){ head='Being confirmed'; sub=`We’re checking the payment with ${esc(bank)}. We’ll update this page as soon as we know.`; tag='Confirming'; tagc='amber';

      steps = base + step('warn','On its way to '+esc(bank),'Waiting for confirmation') + step('todo','Delivered',''); }

function rAdded(){
  const R = S.rcp, prev = R.err; let ok = false;
  try { ok = rValidate('capture'); } catch(e){ ok = false; }
  R.err = prev; if (!ok) return null;
  const cc = S.request.country, f = R.f, m = R.method, k = String(f.key||'').trim(), d = digits(k);
  if (cc==='BR' && m==='key') return isEmail(k) ? 'Pix key (email)' : (/^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$/.test(k) && !k.startsWith('+')) ? 'Pix key (CPF)' : (d.length>=12||k.startsWith('+')) ? 'Pix key (phone)' : 'Pix key';
  if (cc==='BR') return 'Bank details';
  if (cc==='CO') return 'Bre-B key';
  if (cc==='MX') return m==='mobile' ? 'Mobile number' : 'CLABE';
  return 'IBAN';
}
function nameMatches(a, b){
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/\s+/).filter(w=>w.length>1);
  const A = norm(a), B = norm(b);
  return B.length && B.every(w=>A.includes(w)) || (A[0]===B[0] && A[A.length-1]===B[B.length-1]);
}

function qrSvg(){
  let cells=''; const n=21; let seed=7;
  const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#17131F"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#17131F"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)) continue; if(rnd()>.52) cells+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#17131F"/>`; }
  return `<svg viewBox="-1 -1 23 23" width="140" height="140" shape-rendering="crispEdges">${cells}${finder(0,0)}${finder(14,0)}${finder(0,14)}</svg>`;
}

/* ---- recipient validation & lookup ---- */
function rValidate(stage){ // stage: 'capture' | 'review'
  const r = S.request, cc = r.country, R = S.rcp, f = R.f, m = R.method, err = {};
  const need = (k, msg) => { if (!String(f[k]||'').trim()) err[k] = msg; };
  if (cc==='BR' && m==='key'){
    const k = String(f.key||'').trim(), d = digits(k);
    if (!k) err.key = 'Enter your Pix key.';
    else if (isEmail(k)) {}
    else if (/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(k)) {}
    else if (/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(k)){ if (!validCPF(d)) err.key = 'This CPF doesn’t check out — the last two digits don’t match. Check for a typo.'; }
    else if (k.startsWith('+') || d.length===13){ if (d.length!==13) err.key='That phone number looks incomplete. Include the area code, like +55 11 98765-4321.'; }
    else if (d.length===11){ if (!validCPF(d) && !/^\d{2}9/.test(d)) err.key = 'This CPF doesn’t check out — the last two digits don’t match. Check for a typo.'; }
    else err.key = 'We don’t recognize this as a Pix key. Use your CPF, phone, email or random key.';
  }
  if (cc==='BR' && m==='bank'){
    need('holder','Enter the account holder’s name.'); need('bank','Enter your bank.');
    if (!/^\d{4}$/.test(digits(f.agency))) err.agency = 'Branch numbers have 4 digits.';
    if (digits(f.account).length < 5) err.account = 'Include the account number and check digit.';
    if (!validCPF(f.cpf)) err.cpf = f.cpf ? 'This CPF doesn’t check out — check the last two digits.' : 'Enter the account holder’s CPF.';
  }
  if (cc==='CO'){
    const k = String(f.key||'').trim(), d = digits(k);
    if (!k) err.key = 'Enter your Bre-B key.';
    else if (isEmail(k) || /^@[a-z0-9]{4,20}$/i.test(k)) {}
    else if (/^\d+$/.test(k.replace(/[\s+]/g,''))){
      const p = d.startsWith('57') && d.length===12 ? d.slice(2) : d;
      if (p.startsWith('3') && p.length!==10) err.key = 'Colombian mobile numbers have 10 digits, starting with 3.';
      else if (!p.startsWith('3') && (p.length<6 || p.length>10)) err.key = 'ID numbers have 6 to 10 digits. If this is a phone number, it should start with 3.';
    } else err.key = 'We don’t recognize this as a Bre-B key. Use your phone, ID number, email or @key.';
  }
  if (cc==='MX' && m==='key'){
    need('holder','Enter the account holder’s name.');
    const d = digits(f.key);
    if (!d) err.key = 'Enter your 18-digit CLABE.';
    else if (d.length!==18) err.key = `A CLABE has 18 digits — this has ${d.length}.`;
    else if (!validCLABE(d)) err.key = 'The last digit doesn’t match the rest of this CLABE. Check for a typo.';
    else if (!CLABE_BANKS[d.slice(0,3)]) err.key = 'We don’t recognize the bank code at the start of this CLABE.';
  }
  if (cc==='MX' && m==='mobile'){
    const d = digits(f.mobile); const p = d.startsWith('52') ? d.slice(2) : d;
    if (p.length!==10) err.mobile = 'Mexican mobile numbers have 10 digits.';
    else if (p !== '5543218765') err.mobile = 'This number isn’t registered for transfers at a supported bank. Use your CLABE instead.';
  }
  if (cc==='ES'){
    need('holder','Enter the account holder’s name.');
    const s = String(f.key||'').replace(/\s/g,'').toUpperCase();
    if (!s) err.key = 'Enter your IBAN.';
    else if (!s.startsWith('ES')) err.key = 'Spanish IBANs start with ES.';
    else if (s.length!==24) err.key = `Spanish IBANs have 24 characters — this has ${s.length}.`;
    else if (!validIBAN(s)) err.key = 'The check digits after “ES” don’t match the rest of this IBAN. Check for a typo.';
  }
  if (stage==='review'){ need('holder','Enter the account holder’s name.'); need('bank','Enter the bank.');
    if (!err.holder){ const ne = nameError(f.holder); if (ne) err.holder = ne.replace('their name','the account holder’s name'); } }
  R.err = err; return Object.keys(err).length===0;
}
const LOOKUP_METHODS = () => { const cc = S.request.country, m = S.rcp.method; return (cc==='BR'&&m==='key') || cc==='CO' || (cc==='MX'&&m==='mobile'); };
function rSig(){ const R = S.rcp, f = R.f, norm = v => String(v||'').replace(/[\s.\-()]/g,'').toUpperCase();
  return [R.method, norm(f.key), norm(f.mobile), norm(f.agency), norm(f.account), norm(f.cpf), LOOKUP_METHODS()?'':String(f.holder||'').trim(), LOOKUP_METHODS()?'':String(f.bank||'').trim()].join('|'); }
let rResolveT = null;
function rInvalidate(){
  const R = S.rcp; clearTimeout(rResolveT); R.resolving = false;
  if (R.lookup && R.lookupSig !== rSig()){ R.lookup = null; if (LOOKUP_METHODS()){ R.f.holder=''; R.f.bank=''; } }
}
function rEnsureResolve(){
  const R = S.rcp; if (R.lookup || R.resolving || R.lookupHold===rSig() || !rAdded()) return;
  R.resolving = true; clearTimeout(rResolveT);
  rResolveT = setTimeout(()=>{ R.resolving = false; if (!rAdded() || S.rcp.screen!=='capture') { render(); return; } rLookup(); R.lookupSig = rSig(); render(); }, 700);
}

function rLookup(){
  const r = S.request, cc = r.country, R = S.rcp, f = R.f, m = R.method, T = TEST[cc];
  let holder = f.holder, bank = f.bank, source = '';
  const hit = (key) => { const L = LOOKUPS[cc] && LOOKUPS[cc][key]; return L && L.kind==='external' ? { holder:L.name, bank:L.bank } : null; };
  const miss = (msg) => { R.lookup = { notFound:true, msg }; };
  if (cc==='BR' && m==='key'){ const k = String(f.key).trim(), d = digits(k);
    const known = d==='52998224725' ? { holder:T.holder, bank:T.holderBank } : hit(isEmail(k) ? k.toLowerCase() : /^[0-9a-f]{8}-/i.test(k) ? k.toLowerCase() : d);
    if (!known) return miss(d.length===11 && !k.startsWith('+') ? 'This CPF isn’t registered as a Pix key. Check for a typo, or try another key, like your phone or email.' : 'We couldn’t find an account with this Pix key. Check for a typo, or try your CPF.');
    holder = known.holder; bank = known.bank; source = 'Name and bank found from your Pix key.'; }
  if (cc==='CO'){ const k = String(f.key).trim(), d = digits(k);
    const known = d==='3005550199' ? { holder:T.holder, bank:T.holderBank } : hit(isEmail(k) ? k.toLowerCase() : d.length===10 ? '57'+d : d);
    if (!known) return miss('We couldn’t find an account with this Bre-B key. Check for a typo, or try the key you registered with your bank.');
    holder = known.holder; bank = known.bank; source = 'Name and bank found from your Bre-B key.'; }
  if (cc==='MX' && m==='key'){ bank = CLABE_BANKS[digits(f.key).slice(0,3)] || bank; source = 'Bank identified from your CLABE.'; }
  if (cc==='MX' && m==='mobile'){ const d = digits(f.mobile), p = d.length===10 ? '52'+d : d;
    const known = p===digits(T.mobile) ? { holder:T.holder, bank:T.holderBank } : hit(p);
    if (!known) return miss('This number isn’t registered for transfers at a bank yet. Check it, or use your CLABE instead.');
    holder = known.holder; bank = known.bank; source = 'Found your number registered for transfers.'; }
  if (cc==='ES'){ const s = String(f.key).replace(/\s/g,'').toUpperCase(); bank = IBAN_BANKS[s.slice(4,8)] || bank || 'Your bank'; source = 'Bank identified from your IBAN.'; f.key = fmtIBAN(s); }
  f.holder = holder; f.bank = bank; R.lookup = { source };
}
function rDetails(){
  const r = S.request, cc = r.country, R = S.rcp, f = R.f, m = R.method;
  let methodLabel, masked;
  if (cc==='BR' && m==='key'){ const k=f.key.trim(), d=digits(k);
    if (isEmail(k)){ methodLabel='Pix key (email)'; masked=maskEmail(k); }
    else if (d.length===11 && validCPF(d)){ methodLabel='Pix key (CPF)'; masked=maskCPF(d); }
    else if (d.length>=12 || k.startsWith('+')){ methodLabel='Pix key (phone)'; masked='+55 •• •••••-'+d.slice(-4); }
    else { methodLabel='Pix key (random)'; masked=k.slice(0,4)+'…'+k.slice(-4); } }
  if (cc==='BR' && m==='bank'){ methodLabel='Bank account'; masked=`Branch ${digits(f.agency)} · account ${maskTail(f.account,3)}`; }
  if (cc==='CO'){ const k=f.key.trim(); methodLabel='Bre-B key'; masked = isEmail(k)?maskEmail(k): k.startsWith('@')?k.slice(0,3)+'•••':'•••• '+digits(k).slice(-4); }
  if (cc==='MX' && m==='key'){ methodLabel='CLABE'; masked='CLABE '+maskTail(f.key); }
  if (cc==='MX' && m==='mobile'){ methodLabel='Registered mobile number'; masked='+52 •• •••• '+digits(f.mobile).slice(-4); }
  if (cc==='ES'){ methodLabel='IBAN'; masked=maskIBAN(f.key); }
  return { holder:f.holder.trim(), bank:f.bank.trim(), methodLabel, masked, nu:false };
}

const ACT = {
  /* sender nav */
  sBack(){ const top=sTop(); if (top==='recipient') S.snd.resolving=false; sBack(); },
  sGo(a){ sGo(a); },
  goHome(){ sReset(['home']); },
  na(){ toast('snd','Not part of this demo.'); },
  help(){ S.snd.sheet='help'; },
  sheetOff(){ S.snd.sheet=null; },
  sClose(){
    const d = S.draft, top = sTop();
    const progress = d && (d.fromRequest || d.resolved || d.name || d.identifier || d.manual.holder || d.manual.key || top==='calc' || top==='request');
    if (!progress){ S.draft=null; sReset(['home']); return; }
    S.snd.sheet='close';
  },
  pickCountry(cc){ S.draft = newDraft(cc); sGo('recipient'); },
  interest(cc){ S.interest[cc] = !S.interest[cc]; },
  lookupOld(){
    const d = S.draft, v = d.identifier.trim(); d.err = {};
    const dg = digits(v);
    if (!v){ d.err.identifier='Enter an email or phone number.'; return; }
    if (!isEmail(v) && dg.length < 8){ d.err.identifier='That doesn’t look like an email or a full phone number with country code.'; return; }
    S.snd.resolving = true;
    later(1000, ()=>{
      S.snd.resolving = false;
      const key = lookupKey(v);
      const hit = LOOKUPS[d.country][key];
      if (hit){ d.resolved = {...hit}; d.name = hit.name; sGo('resolved'); }
      else { d.resolved = null; sGo('nomatch'); }
    });
  },
  lookup(){
    const d = S.draft, q = d.identifier.trim(), L = d.lookup && d.lookup.for===q ? d.lookup : null;
    if (L && L.state==='hit') return ACT.pickLookup();
    if (L && L.state==='none') return ACT.toNoMatch();
    if (!L && !looksComplete(q)) d.err.identifier = d.country==='BR' ? 'Enter a full email, phone with +55, CPF or Pix key.' : 'Enter a full email, or a phone number with the country code.';
  },
  pickLookup(){ const d = S.draft; d.resolved = {...d.lookup.hit}; d.name = d.lookup.hit.name; ACT.toCalcLive(); },
  toNoMatch(){ const d = S.draft; d.resolved = null; d.err = {}; d.missed = true; ACT.chooseAsk(); },
  retrySearch(){ const d = S.draft; d.identifier=''; d.lookup=null; d.missed=false; sBack(); pendingFocus='draft.identifier'; },
  didSendYes(){ const r=S.request; r.sentVia = r.pendingVia || 'copy'; r.sentAt = new Date(S.now); S.snd.sheet=null; sReset(['home','reqstatus','allset']); S.snd.dir='fwd'; },

  resendEmail(){ toast('snd','We’ve emailed '+firstName(S.request.name)+' again.'); S.request.remindedAt = new Date(S.now); },
  resumeFromToast(){ S.snd.toast=null; if (S.request && S.request.status==='ready'){ resumeFromRequest(); sReset(['home','reqstatus','calc']); S.snd.dir='fwd'; } },
  rateInfo(){ S.snd.sheet='rate'; },
  toggleFees(){ S.snd.sheet='fees'; },
  toggleFeesReview(){ S.snd.sheet='fees'; },
  manualFromRecipient(){ const d=S.draft; d.err={}; d.manual = { tab:'key', holder:d.name }; sGo('manual'); },
  pickContact(id){
    const c = [...S.added, ...CONTACTS.recent, ...CONTACTS.saved].find(x=>x.id===id);
    if (c.reqId && S.request && S.request.id===c.reqId && S.request.status==='ready'){ resumeFromRequest(); sGo('calc'); return; }
    const d = newDraft(c.country); d.name = c.name;
    d.resolved = { kind:c.nu?'nu':'external', name:c.name, bank:c.bank, method:c.method, masked:c.masked };
    S.draft = d; liveQuote(d); sGo('calc');
  },
  toCalcLive(){ const d=S.draft; liveQuote(d); d.mode='live'; d.anchor='send'; d.anchorStr=''; d.active='send'; d.fresh=false; sGo('calc'); },
  notThem(){ S.draft.resolved=null; sBack(); },
  chooseAsk(){ const d=S.draft; d.err={};
    if (S.opts.noMatchFlow==='ask'){ d.mode='ask'; if (d.askStr==null) d.askStr=''; sGo('request'); return; }
    d.mode='estimate'; d.rate=marketRate(d.country,'estimate'); d.quoteAt=null; d.validUntil=null; d.anchor='receive'; d.anchorStr=''; d.active='receive'; d.fresh=false; sGo('calc'); },
  chooseManual(){ const d=S.draft; d.err={}; d.manual = { tab:'key', holder:d.name }; sGo('manual'); },
  mTab(t){ S.draft.manual.tab=t; S.draft.err={}; },
  manualSubmit(){
    const d = S.draft, m = d.manual, cc = d.country, err = {};
    { const ne = nameError(m.holder); if (ne) err.holder = ne==='Add their name.' ? 'Enter the account holder’s name.' : ne; }
    let bank='', method='', masked='';
    const k = String(m.key||'').trim(), dg = digits(k);
    if (cc==='BR' && m.tab==='key'){
      if (!k) err.key='Enter a Pix key.';
      else if (isEmail(k)){ method='Pix key (email)'; masked=maskEmail(k); }
      else if (/^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$/.test(k) && !k.startsWith('+')){ if (!validCPF(dg)) err.key='This CPF doesn’t check out — the last two digits don’t match.'; else { method='Pix key (CPF)'; masked=maskCPF(dg); } }
      else if (dg.length===13){ method='Pix key (phone)'; masked='+55 •• •••••-'+dg.slice(-4); }
      else err.key='Use a CPF, phone with +55, email or random key.';
      bank = dg==='52998224725' ? 'Itaú' : 'Banco do Brasil';
    }
    if (cc==='BR' && m.tab==='bank'){
      if (!String(m.bank||'').trim()) err.bank='Enter the bank.';
      if (!/^\d{4}$/.test(digits(m.agency))) err.agency='Branch numbers have 4 digits.';
      if (digits(m.account).length<5) err.account='Include the account number and check digit.';
      if (!validCPF(m.cpf)) err.cpf='Enter a valid CPF for the account holder.';
      bank = m.bank; method='Bank account'; masked = 'Account '+maskTail(m.account,3);
    }
    if (cc==='CO'){ if (!k) err.key='Enter a Bre-B key.'; else { bank = dg==='3005550199'?'Davivienda':'Bancolombia'; method='Bre-B key'; masked= isEmail(k)?maskEmail(k):'•••• '+dg.slice(-4); } }
    if (cc==='MX'){ if (dg.length!==18) err.key=`A CLABE has 18 digits — this has ${dg.length}.`; else if (!validCLABE(dg)) err.key='The last digit doesn’t match the rest of this CLABE. Check for a typo.'; else if (!CLABE_BANKS[dg.slice(0,3)]) err.key='Unknown bank code.'; else { bank=CLABE_BANKS[dg.slice(0,3)]; method='CLABE'; masked='CLABE '+maskTail(dg); } }
    if (cc==='ES'){ const s=k.replace(/\s/g,'').toUpperCase(); if (!s) err.key='Enter an IBAN.'; else if (!validIBAN(s)) err.key = s.length!==24 ? `Spanish IBANs have 24 characters — this has ${s.length}.` : 'The check digits after “ES” don’t match the rest of this IBAN.'; else { bank=IBAN_BANKS[s.slice(4,8)]||'Spanish bank'; method='IBAN'; masked=maskIBAN(s); } }
    d.err = err; if (Object.keys(err).length) return;
    d.name = m.holder.trim();
    d.resolved = { kind:'external', name:m.holder.trim(), bank, method, masked };
    sGo('resolved');
  },
  setActive(side){
    const d = S.draft; if (d.active===side) return;
    d.active = side; d.showFees = false; d.fresh = true;
  },
  key(k){
    const d = S.draft, c = COUNTRIES[d.country]; d.showFees = false; d.prevQuote = null;
    if (d.fresh){ if (d.active!==d.anchor){ d.anchor=d.active; } d.anchorStr=''; d.fresh=false; if (k==='del') return; }
    else if (d.active!==d.anchor){ d.anchor=d.active; d.anchorStr=''; }
    let s = d.anchorStr || '';
    const dec = d.active==='send' ? 2 : c.dec;
    if (k==='del') s = s.slice(0,-1);
    else if (k==='.'){ if (dec===0 || s.includes('.')) return; s = (s||'0') + '.'; }
    else { if (s.includes('.') && s.split('.')[1].length>=dec) return; if (s.replace('.','').length>=10) return; s = (s==='0' ? '' : s) + k; }
    d.anchorStr = s;
  },
  calcNext(){

function fillTestDetails(){
  const r = S.request, cc = r.country, T = TEST[cc], R = S.rcp;
  R.method = 'key'; R.f = {};
  if (cc==='BR') R.f.key = T.keyValid;
  if (cc==='CO') R.f.key = T.keyValid;
  if (cc==='MX'){ R.f.key = T.keyValid; R.f.holder = T.holder; }
  if (cc==='ES'){ R.f.key = T.keyValid; R.f.holder = T.holder; }
  rLookup();
}

let lookupTimer = null;
function identChanged(){
  const d = S.draft; if (!d) return; d.err = {}; const q = d.identifier.trim();
  if (!looksComplete(q)){ clearTimeout(lookupTimer); d.lookup = null; return; }
  if (d.lookup && d.lookup.for===q) return;
  clearTimeout(lookupTimer); d.lookup = { for:q, state:'searching' };
  lookupTimer = setTimeout(()=>{
    if (!S.draft || S.draft.identifier.trim()!==q) return;
    const key = lookupKey(q);
    const hit = LOOKUPS[S.draft.country][key];
    S.draft.lookup = { for:q, state: hit?'hit':'none', hit: hit?{...hit}:null };
    if (!hit && sTop()==='recipient'){ S.draft.resolved = null; S.draft.missed = true; ACT.chooseAsk(); }
    render();
  }, 1000);
}

/* ================= Scenarios ================= */
function baseRequest(cc='BR', mode){
  const T = TEST[cc], d = newDraft(cc); mode = mode || S.opts.noMatchFlow;
  const amt = cc==='BR'?'500':cc==='CO'?'400000':cc==='MX'?'2000':'250';
  d.name = T.name; d.identifier = cc==='BR' ? T.phone : T.email; d.purpose='Gift';
  if (mode==='ask'){ d.mode='ask'; d.askStr = amt; }
  else { d.mode='estimate'; d.rate=marketRate(cc,'estimate'); d.anchor='receive'; d.anchorStr = amt; }
  S.draft = d; createRequest(); S.draft = null;
  S.request.sentVia = S.request.channel==='phone' ? 'whatsapp' : 'email'; S.request.sentAt = new Date(S.now);
}
function readyRequest(mode, cc){ baseRequest(cc||'BR', mode); tick(47); fillTestDetails(); submitDetails(rDetails()); S.rcp.screen='status'; }
function readyToast(){
  const r = S.request, fn = firstName(r.name), amt = fmtCurX(r.intendedReceive,r.country)||'Your transfer';
  toast('snd', nameCheckReq(r)==='diff' ? `${fn} added details, but the account is in another name. Check before sending.` : `${fn} added their details. ${amt} is ready to send.`, 'resumeFromToast');
}
function requoteToCalc(){
  const d = S.draft, a = amounts(d);
  d.prevQuote = { total:a.total, send:a.send };
  const old = d.rate; d.anchor='receive'; d.anchorStr=String(a.receive); d.active='receive'; d.fresh=true;
  liveQuote(d); const m = S.opts.quoteMove; d.rate = m==='up' ? old*0.9965 : m==='down' ? old*1.003 : old;
  const st = S.snd.stack, i = st.lastIndexOf('calc');
  S.snd.stack = i>=0 ? st.slice(0,i+1) : [...st.slice(0,-1),'calc']; S.snd.dir='back'; S.snd.sheet=null;
}
function reviewBlocked(){ const d=S.draft; if (!d) return true; const a=amounts(d); return !quoteValid(d) || a.total > S.balance || a.send > limitOf(d.country); }
function scenario(name){
  clearTimers(); const view = S.view, q = S.opts.quoteMove, o = S.opts.outcome;
  S = newState(); S.view = view; S.opts.quoteMove = q; S.opts.outcome = o;
  const resolvedDraft = (cc, key, shown) => { const d = newDraft(cc), hit = LOOKUPS[cc][key]; d.identifier = shown||key; d.resolved={...hit}; d.name=hit.name; d.lookup={for:d.identifier, state:'hit', hit:{...hit}}; S.draft=d; return d; };
  switch(name){
    case 'fresh': break;
    case 'p1': S.draft = newDraft('CO'); S.snd.stack=['home','send','dest','recipient']; tdTab='CO'; break;
    case 'p2': S.draft = newDraft('BR'); S.snd.stack=['home','send','dest','recipient']; tdTab='BR'; break;
    case 'p3': S.draft = newDraft('MX'); S.snd.stack=['home','send','dest','recipient']; tdTab='MX'; break;
    case 'mxAwaiting': baseRequest('MX'); tdTab='MX'; break;
    case 'mxReady': readyRequest(null,'MX'); tdTab='MX'; break;
    case 'declined': baseRequest(); tick(30); declineRequest(); S.snd.stack=['home','reqstatus']; S.rcp.screen='closed'; break;
    case 'awaiting': baseRequest(); tdTab='BR'; break;
    case 'ready': readyRequest(); tdTab='BR'; break;
    case 'resNu': { const d = resolvedDraft('MX','525512345678','+52 55 1234 5678'); d.resolved=null; S.snd.stack=['home','send','dest','recipient']; break; }
    case 'resExt': { const d = resolvedDraft('CO','camila.rojas@example.com'); d.resolved=null; S.snd.stack=['home','send','dest','recipient']; break; }
    case 'mismatch': readyRequest(); S.request.details.holder='Rafael Lima'; resumeFromRequest(); S.snd.stack=['home','reqstatus','calc']; readyToast(); tdTab='BR'; break;
    case 'readyLate': readyRequest(); tick(8*1440); S.snd.stack=['home','reqstatus']; tdTab='BR'; break;
    case 'invalid': baseRequest(); Object.assign(S.rcp, { screen:'capture', choice:'bank', method:'key', f:{ key:TEST.BR.keyInvalid } }); rValidate('capture'); break;
    case 'limit': { const d = resolvedDraft('BR','5521998765432'); liveQuote(d); d.anchor='send'; d.active='send'; d.anchorStr='6000'; S.snd.stack=['home','send','dest','recipient','resolved','calc']; break; }
    case 'quote': S.opts.quoteMove = q==='flat' ? 'up' : q; readyRequest('estimate'); resumeFromRequest(); S.snd.stack=['home','reqstatus','calc']; break;
    case 'balance': readyRequest(); S.balance = 60; resumeFromRequest(); S.snd.stack=['home','reqstatus','calc','review']; break;
    case 'cancelled': baseRequest(); tick(90); cancelRequest(); S.snd.stack=['home','cancelled']; break;
    case 'expired': baseRequest(); S.now = new Date(S.request.expiresAt.getTime()+60000); checkExpiry(); S.snd.stack=['home','reqstatus']; break;
    case 'delayed': case 'uncertain': case 'returned':
      readyRequest(); resumeFromRequest(); authorize(name); S.snd.stack=['home','processing']; S.rcp.screen='status'; break;
  }
  S.snd.dir='fade'; S.rcp.dir='fade';
}

/* ================= Render ================= */
let prevKeys = { snd:null, rcp:null };
let railScrollMem = 0;
let pendingFocus = null;

function setPath(path, val){
  const parts = path.split('.'); let o = S;
  for (let i=0;i<parts.length-1;i++){ o = o[parts[i]]; if (!o) return; }
  o[parts[parts.length-1]] = val;
}
function getPath(path){ return path.split('.').reduce((o,k)=>o&&o[k], S); }

function screenHTML(side){
  if (side==='snd'){
    const key = sTop() + (sTop()==='processing' ? '' : '');
    let html = senderScreen() + senderSheet() + (S.snd.toast?`<div class="toast ${S.snd.toast.act?'tap':''}" role="status" ${S.snd.toast.act?`data-act="${S.snd.toast.act}"`:''}>${S.snd.toast.msg}${S.snd.toast.act?'<span class="tgo">Open</span>':''}</div>`:'');
    return { key, html, dir:S.snd.dir };
  }
  const key = rScreen();
  let html = recipientScreen() + recipientSheet() + (S.rcp.toast?`<div class="toast" role="status">${S.rcp.toast.msg}</div>`:'');
  return { key, html, dir:S.rcp.dir };
}

function render(){
  checkExpiry();
  const active = document.activeElement;
  const focusBind = pendingFocus || (active && active.dataset && active.dataset.bind) || null;
  const sel = active && active.dataset && active.dataset.bind && typeof active.selectionStart==='number' ? [active.selectionStart, active.selectionEnd] : null;
  pendingFocus = null;
  const railScroll = document.querySelector('.rail-b')?.scrollTop || railScrollMem;
  const bodyScroll = {};
  document.querySelectorAll('.screen').forEach(s=>{ const b=s.querySelector('.body'); if (b) bodyScroll[s.dataset.side+'|'+s.dataset.key]=b.scrollTop; });

  const showS = S.view!=='recipient', showR = S.view!=='sender';
  const dev = (side, label, pill) => {
    const {key, html, dir} = screenHTML(side);
    const changed = prevKeys[side] !== key; prevKeys[side] = key;
    const cls = changed ? (dir==='back'?'enter-back':dir==='fwd'?'enter-fwd':'enter-fade') : '';
    const out = html.replace('<div class="scr', `<div class="scr ${cls}`);
    return `<div class="device"><div class="device-label">${label}<span class="pill">${pill}</span></div>
      <div class="phone"><div class="screen" data-side="${side}" data-key="${key}">${out}</div></div></div>`;
  };
  const stage = `<main class="stage" id="stage">
    ${showS?dev('snd','Ana · sender','Nu app · U.S.'):''}
    ${showR?dev('rcp', S.request?esc(S.request.name)+' · recipient':S.transfer?esc(S.transfer.recipient.name)+' · recipient':'Recipient','Mobile browser · no app'):''}
  </main>`;
  const railBtn = `<button class="rb railshow" data-act="pRail">Show controls</button>`;
  document.getElementById('app').innerHTML = `<div class="app">${railHidden?railBtn:presenter()}${stage}</div>`;
  if (!showS) prevKeys.snd = null; if (!showR) prevKeys.rcp = null;
  S.snd.dir = 'none'; S.rcp.dir = 'none';

  railScrollMem = railScroll; const rb = document.querySelector('.rail-b'); if (rb) rb.scrollTop = railScroll;
  document.querySelectorAll('.screen').forEach(s=>{ const b=s.querySelector('.body'); const k=s.dataset.side+'|'+s.dataset.key; if (b && bodyScroll[k]!=null) b.scrollTop=bodyScroll[k]; });
  if (focusBind){
    const el = document.querySelector(`[data-bind="${focusBind}"]`);
    if (el){ el.focus({preventScroll:true}); if (sel && !pendingFocus) try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} else { const n=el.value.length; try{ el.setSelectionRange(n,n);}catch(e){} } }
  }
  fit();
  document.querySelectorAll('[data-countup]').forEach(el=>{
    const v = parseFloat(el.dataset.countup), cc = el.dataset.cc, t0 = parseFloat(el.dataset.t0)||performance.now(), D = 1400, dec = COUNTRIES[cc].dec===0;
    el.removeAttribute('data-countup');
    let last = '';
    const step = now => { const p = Math.min(1,(now-t0)/D), e = 1-Math.pow(1-p,4), x = v*(0.6+0.4*e);
      const txt = fmtCur(p>=1 ? v : dec ? Math.round(x/10)*10 : Math.round(x*100)/100, cc);
      if (txt!==last){ el.textContent = txt; last = txt; }
      if (p<1 && el.isConnected) requestAnimationFrame(step); };
    step(performance.now());
  });
}

function fit(){
  const stage = document.getElementById('stage'); if (!stage) return;
  const devs = stage.querySelectorAll('.device'); if (!devs.length) return;
  const H = stage.clientHeight - 24, W = stage.clientWidth - 40;
  const needH = 864 + 32, needW = devs.length*410 + (devs.length-1)*56;
  const s = Math.min(1, H/needH, W/needW);
  devs.forEach(d=>{ d.style.transform = `scale(${s})`; d.style.margin = `${-(1-s)*needH/2}px ${-(1-s)*410/2}px`; });
  stage.style.gap = (56*s)+'px';
}

/* ================= Events ================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  fn(el.dataset.arg, el);
  render();
});
document.addEventListener('input', e=>{
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  setPath(el.dataset.bind, el.value);
  if (el.dataset.bind==='draft.identifier'){ S.draft.fromDevice=false; identChanged(); render(); return; }
  if (el.dataset.bind.startsWith('rcp.f.') && S.rcp.screen==='capture'){ const k = el.dataset.bind.slice(6); delete S.rcp.unsure[k]; S.rcp.err = {}; if (k!=='updEmail'){ S.rcp.lookupHold=null; rInvalidate(); } render(); return; }
  if (el.dataset.bind.startsWith('rcp.f.')){ const k = el.dataset.bind.slice(6); if (S.rcp.unsure[k]){ delete S.rcp.unsure[k]; el.classList.remove('unsure'); const m=el.parentElement.querySelector('.unsuremsg'); if (m) m.remove(); } }
});
document.addEventListener('focusin', e=>{ const el=e.target; if (el.dataset && el.dataset.bind) lastBind = el.dataset.bind; });
document.addEventListener('keydown', e=>{
  const el = e.target;
  if (e.key==='Enter' && el.dataset && el.dataset.enter){ e.preventDefault(); ACT[el.dataset.enter](); render(); return; }
  if (el.tagName==='INPUT' || el.tagName==='TEXTAREA') return;
  if (e.key==='\\'){ ACT.pRail(); render(); return; }
  if (S.view!=='recipient' && sTop()==='calc' && S.draft && !S.snd.sheet){
    if (/^[0-9]$/.test(e.key)) { ACT.key(e.key); render(); }
    else if (e.key==='.') { ACT.key('.'); render(); }
    else if (e.key==='Backspace') { ACT.key('del'); render(); }
  }
});
window.addEventListener('resize', fit);

S = newState();
render();

</script></body></html>
