<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>International Transfer Prototype</title>
<style>:root{
  --ink:#17131F; --ink-2:#4A4458; --ink-3:#6B6579;
  --line:#ECE8F2; --line-2:#DDD7E7;
  --ground:#F7F5FA; --surface:#FFFFFF;
  --purple:#6A1FD0; --purple-ink:#4E159C; --purple-tint:#F3EDFD; --purple-soft:#E4D8FA;
  --green:#0D7449; --green-tint:#E7F4EC;
  --amber:#8F5300; --amber-tint:#FDF2DF;
  --red:#B42318; --red-tint:#FDEDEB;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --rail:#121016; --rail-2:#1B1821; --rail-line:#2B2733; --rail-ink:#EEEBF4; --rail-mute:#A39DB0; --rail-accent:#C0A0FA;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#E8E5EE;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
.app{display:flex;height:100vh;width:100vw}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:56px;position:relative;
  background:radial-gradient(circle at 1px 1px,#d9d4e2 1px,transparent 0) 0 0/22px 22px,#ECE9F1}
.device{display:flex;flex-direction:column;align-items:center;gap:14px;transform-origin:center center}
.device-label{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em;display:flex;gap:8px;align-items:center}
.device-label .pill{font-weight:600;font-size:11px;padding:3px 8px;border-radius:99px;background:#fff;border:1px solid var(--line-2);color:var(--ink-3)}
.phone{width:410px;height:864px;border-radius:58px;background:#0E0C12;padding:10px;box-shadow:0 30px 60px -20px rgba(40,20,80,.35),0 0 0 1px #2a2532 inset}
.screen{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--ground)}

/* ---------- Screen scaffolding ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ground)}
.scr.white{background:var(--surface)}
.scr.enter-fwd{animation:inFwd .32s var(--ease)}
.scr.enter-back{animation:inBack .32s var(--ease)}
.scr.enter-fade{animation:fadeIn .3s var(--ease)}
@keyframes inFwd{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;padding:54px 12px 6px;min-height:104px}
.hdr .t{font-size:16px;font-weight:600;text-align:center;flex:1}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:rgba(23,19,31,.06)}
.ib svg{width:22px;height:22px}
.body{flex:1;overflow-y:auto;padding:4px 20px 20px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.foot{flex:none;padding:12px 20px 34px;display:flex;flex-direction:column;gap:10px;background:inherit}
h1.title{font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:650;margin:4px 0 8px}
p.lead{font-size:16px;line-height:1.45;color:var(--ink-2);margin:0 0 20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 10px}
.muted{color:var(--ink-3)} .small{font-size:13px;line-height:1.4}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}

/* buttons */
.btn{height:54px;border-radius:16px;border:0;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s var(--ease),background .2s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--purple);color:#fff}
.btn.primary:hover{background:#5D19BA}
.btn.primary[disabled]{background:#CFC6DE;color:#fff;cursor:not-allowed}
.btn.secondary{background:var(--purple-tint);color:var(--purple-ink)}
.btn.ghost{background:transparent;color:var(--purple-ink);height:46px}
.btn.danger{background:var(--red-tint);color:var(--red)}
.btn svg{width:20px;height:20px}
.link{background:none;border:0;color:var(--purple-ink);font-weight:600;padding:10px 0;min-height:44px;font-size:15px;text-align:left}

/* cards & lists */
.card{background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--line)}
.list{background:var(--surface);border-radius:20px;border:1px solid var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px;border:0;background:transparent;width:100%;text-align:left}
.li + .li{border-top:1px solid var(--line)}
button.li:hover{background:#FAF8FD}
.li .main{flex:1;min-width:0}
.li .l1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .l2{font-size:13px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .amt .l2{text-align:right;font-weight:500}
.chev{width:18px;height:18px;color:#B3ADBF;flex:none}
.av{width:40px;height:40px;border-radius:20px;background:var(--purple-tint);color:var(--purple-ink);display:grid;place-items:center;font-weight:650;font-size:14px;flex:none;position:relative}
.av.lg{width:56px;height:56px;border-radius:28px;font-size:19px}
.av.neutral{background:#F0EEF3;color:var(--ink-2)}
.av svg{width:20px;height:20px}
.av .flag{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:9px;border:2px solid #fff;overflow:hidden;background:#fff}
.flag svg,.flag{display:block}
.flagbox{width:28px;height:28px;border-radius:14px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.flagbox svg{width:100%;height:100%}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{height:54px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 16px;font-size:17px;outline:none;width:100%;transition:border-color .15s, box-shadow .15s}
.input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(106,31,208,.12)}
.input.err{border-color:var(--red)}
.input.unsure{border-color:#D69A2D;background:#FFFBF2}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6B6579 50%),linear-gradient(135deg,#6B6579 50%,transparent 50%);background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;background-size:6px 6px;background-repeat:no-repeat}
.hint{font-size:13px;color:var(--ink-3);line-height:1.4}
.errmsg{font-size:13px;color:var(--red);line-height:1.4;display:flex;gap:6px}
.unsuremsg{font-size:13px;color:var(--amber);line-height:1.4}

/* notices */
.note{border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.note.info{background:var(--purple-tint);color:var(--purple-ink)}
.note.neutral{background:#F0EEF4;color:var(--ink-2)}
.note.ok{background:var(--green-tint);color:var(--green)}
.note.warn{background:var(--amber-tint);color:var(--amber)}
.note.bad{background:var(--red-tint);color:var(--red)}
.note b{font-weight:650}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:550}
.chip.on{border-color:var(--purple);background:var(--purple-tint);color:var(--purple-ink)}
.seg{display:flex;background:#ECE8F2;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border:0;border-radius:11px;background:transparent;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.purple{background:var(--purple-tint);color:var(--purple-ink)}
.tag.green{background:var(--green-tint);color:var(--green)}
.tag.amber{background:var(--amber-tint);color:var(--amber)}
.tag.red{background:var(--red-tint);color:var(--red)}
.tag.gray{background:#EFEDF2;color:var(--ink-2)}
.sim{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-3);border:1px dashed #C9C2D6;border-radius:8px;padding:2px 7px}

/* key-value */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 0;font-size:15px}
.kv + .kv{border-top:1px solid var(--line)}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kv.total .k{color:var(--ink);font-weight:600}
.kv.total .v{font-size:17px}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .step{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl .step:last-child{padding-bottom:0}
.tl .step:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line-2)}
.tl .step.done:not(:last-child)::before{background:var(--purple)}
.tl .dot{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2)}
.tl .done .dot{background:var(--purple);border-color:var(--purple);color:#fff}
.tl .now .dot{border-color:var(--purple);box-shadow:0 0 0 5px rgba(106,31,208,.12)}
.tl .now .dot::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--purple);animation:pulse 1.6s ease-in-out infinite}
.tl .warn .dot{border-color:#D69A2D;background:var(--amber-tint);color:var(--amber)}
.tl .bad .dot{border-color:var(--red);background:var(--red-tint);color:var(--red)}
.tl .dot svg{width:14px;height:14px}
.tl .s1{font-size:15px;font-weight:600;padding-top:3px}
.tl .s2{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.tl .todo .s1{color:var(--ink-3);font-weight:550}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}

/* home */
.home-top{padding:58px 20px 0;display:flex;align-items:center;justify-content:space-between}
.home-top .hi{font-size:15px;font-weight:600}
.bal{padding:18px 20px 6px}
.bal .lbl{font-size:14px;color:var(--ink-3);font-weight:550}
.bal .amt{font-size:40px;font-weight:650;letter-spacing:-.03em;margin-top:4px}
.bal .amt .c{font-size:24px;color:var(--ink-3);font-weight:600;margin-left:4px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;padding:6px 0;font-size:13px;font-weight:600}
.act .ic{width:56px;height:56px;border-radius:28px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.act.main .ic{background:var(--purple);border-color:var(--purple);color:#fff}
.act .ic svg{width:22px;height:22px}
.pending-card{border-radius:20px;padding:16px;background:var(--surface);border:1.5px solid var(--purple-soft);display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.pending-card.ready{border-color:var(--purple);box-shadow:0 8px 24px -12px rgba(106,31,208,.45)}

/* calculator */
.calc{display:flex;flex-direction:column;flex:1;min-height:0;padding:0 16px}
.to-chip{display:flex;align-items:center;gap:10px;padding:2px 4px 10px}
.to-chip .n{font-size:15px;font-weight:600}
.to-chip .s{font-size:13px;color:var(--ink-3)}
.amtbox{border-radius:18px;background:var(--surface);border:1.5px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:76px;width:100%;text-align:left}
.amtbox + .amtbox{margin-top:8px}
.amtbox.on{border-color:var(--purple);box-shadow:0 0 0 4px rgba(106,31,208,.10)}
.amtbox.err{border-color:var(--red)}
.amtbox .cur{display:flex;align-items:center;gap:8px;flex:none}
.amtbox .cur .code{font-size:15px;font-weight:650}
.amtbox .lbl{font-size:12px;color:var(--ink-3);font-weight:550}
.amtbox .val{flex:1;text-align:right;font-size:32px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.amtbox .val .caret{display:inline-block;width:2px;height:30px;background:var(--purple);vertical-align:-4px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.quote{padding:8px 4px 0}
.quote .kv{padding:6px 0;font-size:14px}
.quote .kv + .kv{border-top:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px 0 0;margin-top:auto}
.key{height:52px;border:0;background:transparent;border-radius:14px;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.key:hover{background:rgba(23,19,31,.05)}
.key:active{background:rgba(23,19,31,.09)}
.key svg{width:24px;height:24px}

/* sheets & overlays */
.scrim{position:absolute;inset:0;background:rgba(18,12,30,.38);animation:fadeIn .2s;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px 34px;z-index:21;animation:up .32s var(--ease);max-height:88%;overflow-y:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#DDD8E5;margin:0 auto 14px}
.sheet h2{font-size:21px;margin:4px 0 8px;letter-spacing:-.01em}
.sheet p{font-size:15px;line-height:1.45;color:var(--ink-2);margin:0 0 16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.toast{position:absolute;left:14px;right:14px;top:52px;z-index:40;background:#1C1724;color:#fff;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.4;animation:up .3s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:down .35s var(--ease)}
@keyframes down{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
.overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:fadeIn .2s}
.overlay.dark{background:rgba(14,10,22,.86);color:#fff}
.overlay.light{background:#FBFAFD}

/* face id */
.faceid{width:120px;height:120px;position:relative;color:#fff}
.faceid svg{width:100%;height:100%}
.faceid .scan{position:absolute;left:8px;right:8px;height:2px;background:#B892FF;box-shadow:0 0 12px #B892FF;top:10px;animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{to{top:108px}}
.faceid.ok .scan{display:none}
.faceid .tick{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* processing amount motion */
.flow{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 20px}
.flow .from{font-size:16px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.flow .to{font-size:42px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.flow .rail{width:2px;height:28px;background:linear-gradient(var(--line-2),var(--purple));position:relative;overflow:hidden}
.flow .rail::after{content:"";position:absolute;left:0;width:2px;height:10px;background:#fff;animation:drip 1.2s linear infinite}
@keyframes drip{from{top:-10px}to{top:28px}}
.flow.still .rail::after{display:none}
.roll{display:inline-block;animation:roll .7s var(--ease)}
@keyframes roll{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.badge-ok{width:72px;height:72px;border-radius:36px;background:var(--green-tint);color:var(--green);display:grid;place-items:center;animation:pop .45s var(--ease)}
.badge-ok svg{width:34px;height:34px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* recipient web */
.webbar{flex:none;padding:52px 16px 10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:550;background:var(--surface);border-bottom:1px solid var(--line)}
.webbar svg{width:12px;height:12px}
.brandline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brandmark{width:28px;height:28px;border-radius:9px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:750;letter-spacing:-.04em}
.hero-amt{font-size:44px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.stepnum{width:28px;height:28px;border-radius:14px;background:var(--purple-tint);color:var(--purple-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.opt{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;border:1.5px solid var(--line-2);background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--purple)}
.opt.featured{border-color:var(--purple)}
.opt.nu{background:linear-gradient(160deg,#F6F0FF,#FFFFFF 70%);border-color:var(--purple-soft)}
.opt .h{font-size:17px;font-weight:650}
.opt ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.opt li{font-size:14px;color:var(--ink-2);display:flex;gap:8px;line-height:1.35}
.opt li svg{width:16px;height:16px;color:var(--purple);flex:none;margin-top:1px}
.methods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mbtn{height:52px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600}
.mbtn svg{width:18px;height:18px;color:var(--purple)}
.mbtn:hover{border-color:var(--purple)}
.mbtn.wide{grid-column:span 2}
.listen{display:flex;gap:4px;align-items:center;height:40px}
.listen i{width:5px;border-radius:3px;background:var(--purple);animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{height:8px}50%{height:36px}}
.transcript{font-size:17px;line-height:1.5;max-width:300px;text-align:center;color:var(--ink)}
.transcript .u{background:#FCE9C4;border-radius:4px;padding:0 2px}
.viewfinder{width:260px;height:260px;border-radius:28px;position:relative;background:#211b2b;overflow:hidden}
.viewfinder .q{position:absolute;inset:50px;background:#fff;border-radius:6px;display:grid;place-items:center}
.viewfinder .corner{position:absolute;width:44px;height:44px;border:4px solid #fff}
.viewfinder .scanline{position:absolute;left:30px;right:30px;height:2px;background:#B892FF;box-shadow:0 0 14px #B892FF;animation:scan2 1.4s ease-in-out infinite alternate;top:40px}
@keyframes scan2{to{top:220px}}
.file{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface);width:100%;text-align:left}
.file:hover{border-color:var(--purple)}
.file .fi{width:40px;height:48px;border-radius:8px;background:#F0EEF4;display:grid;place-items:center;color:var(--ink-2);font-size:10px;font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;height:100%;padding:40px;color:var(--ink-3)}

/* message app (invite) */
.msgs{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;background:#fff}
.bubble{max-width:82%;border-radius:20px;padding:10px 14px;font-size:15px;line-height:1.4;background:#EEECF1;align-self:flex-start}
.linkcard{align-self:flex-start;width:82%;border-radius:20px;overflow:hidden;background:#EEECF1;border:0;text-align:left;padding:0}
.linkcard .top{background:var(--purple);color:#fff;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.linkcard .top .a{font-size:24px;font-weight:650;letter-spacing:-.02em}
.linkcard .bot{padding:10px 14px;font-size:13px;color:var(--ink-2)}
.msghdr{flex:none;padding:54px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#F7F6F9;border-bottom:1px solid var(--line)}

.optin{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px;color:var(--ink-2)}

.key{height:50px}
.quote .kvbtn .v{white-space:nowrap}

.ib.info{color:#B3ADBF;margin-right:6px}

.emailcard{border:1.5px solid var(--line-2);border-radius:18px;background:var(--surface);overflow:hidden}
.emailcard .ec-h{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}

.emailcard .ec-note{border:1.5px dashed var(--purple-soft);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;resize:none;outline:none;background:#FBF9FF;color:var(--ink)}
.emailcard .ec-note:focus{border-style:solid;border-color:var(--purple)}
.emailcard .ec-btn{align-self:flex-start;background:var(--purple);color:#fff;font-weight:600;border-radius:12px;padding:9px 14px;font-size:14px}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:#D9D4E2;position:relative;flex:none;transition:background .2s}

.sendercard{border-radius:20px;padding:16px;background:linear-gradient(160deg,#F4EEFF,#FBF9FF);margin-bottom:12px}

.optrow{flex-direction:row;align-items:center;gap:12px;padding:14px 16px}
.nupromo{margin-top:12px;border-radius:20px;padding:18px;background:linear-gradient(140deg,#7A22E0,#5B14B8);color:#fff;position:relative;overflow:hidden}
.nupromo::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:75px;border:18px solid rgba(255,255,255,.08)}

.em{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin-bottom:24px}

/* ---- transfer journey ---- */
.journey{display:flex;align-items:flex-start;justify-content:space-between;width:100%;padding:14px 4px 18px;gap:6px}
.jr-end{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;flex:none}
.jr-flag{position:relative;width:52px;height:52px;border-radius:26px;overflow:visible}
.jr-flag>svg{width:52px;height:52px;border-radius:26px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 6px 14px -6px rgba(0,0,0,.25);display:block}
.jr-amt{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;transition:opacity .4s}
.dest .jr-amt{font-size:17px;color:var(--ink)}
.jr-lbl{font-size:12px;color:var(--ink-3);margin-top:-4px}
.jr-track{position:relative;flex:1;height:52px}
.jr-line{position:absolute;left:0;right:0;top:25px;border-top:2px dashed var(--line-2)}
.jr-fill{position:absolute;left:0;top:25px;height:2px;width:var(--to);background:var(--purple);border-radius:2px}
.jr-dot{position:absolute;top:26px;left:var(--to);width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 5px rgba(106,31,208,.18);display:grid;place-items:center;color:#fff}
.jr-dot svg{width:12px;height:12px}
.journey.go .jr-dot{animation:jrpulse 1.4s ease-in-out infinite}
.journey.go .jr-line{animation:jrdash 1s linear infinite;border-top-color:transparent;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 12px);height:2px;border:0;background-size:12px 2px}
.journey.fresh .jr-fill{animation:jrfill .9s var(--ease) both}
.journey.fresh .jr-dot{animation:jrmove .9s var(--ease) both}
.journey.fresh.go .jr-dot{animation:jrmove .9s var(--ease) both, jrpulse 1.4s ease-in-out .9s infinite}
.journey.ok .jr-fill,.journey.ok .jr-dot{background:var(--green)}
.journey.ok .jr-dot{box-shadow:0 0 0 5px rgba(13,116,73,.16);opacity:0}
.journey.celebrate .jr-dot{opacity:1;animation:jrmove .7s var(--ease) both, jrfade .3s .65s both}
.journey.warn .jr-fill,.journey.warn .jr-dot{background:var(--amber)}
.journey.warn .jr-dot{box-shadow:0 0 0 5px rgba(143,83,0,.16)}
.journey.bad .jr-fill,.journey.bad .jr-dot{background:var(--red)}
.journey.bad .jr-dot{box-shadow:0 0 0 5px rgba(190,30,45,.14)}
.journey.ok .dest .jr-flag>svg{box-shadow:0 0 0 3px var(--green),0 8px 18px -6px rgba(13,116,73,.45)}
.journey.celebrate .dest .jr-flag>svg{animation:jrbounce .7s cubic-bezier(.34,1.56,.64,1) .6s both}
.jr-ring{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.journey.celebrate .jr-ring{animation:jrring 1s ease-out .7s both}
.jr-conf{position:absolute;left:50%;top:50%;pointer-events:none}
.jr-conf i{position:absolute;width:7px;height:4px;border-radius:1px;left:-3px;top:-2px;opacity:0;animation:jrconf .95s cubic-bezier(.2,.7,.3,1) both}
.journey.celebrate .jr-conf i{animation-delay:.7s}
@keyframes jrmove{from{left:var(--from)}to{left:var(--to)}}
@keyframes jrfill{from{width:var(--from)}to{width:var(--to)}}
@keyframes jrpulse{0%,100%{box-shadow:0 0 0 5px rgba(106,31,208,.18)}50%{box-shadow:0 0 0 10px rgba(106,31,208,.06)}}
@keyframes jrdash{to{background-position:12px 0}}
@keyframes jrfade{to{opacity:0}}
@keyframes jrbounce{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1.12)}}
@keyframes jrring{0%{box-shadow:0 0 0 0 rgba(13,116,73,.45)}100%{box-shadow:0 0 0 26px rgba(13,116,73,0)}}
@keyframes jrconf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.journey.ok:not(.celebrate) .dest .jr-flag>svg{transform:scale(1.12)}
.step.flagstep .dot{background:none;padding:0;overflow:hidden;box-shadow:0 0 0 2px var(--green)}
.step.flagstep .dot svg{width:100%;height:100%;display:block}
/* recipient push notification */
.pushnote{position:absolute;left:10px;right:10px;top:46px;z-index:30;display:flex;gap:10px;align-items:flex-start;background:rgba(250,249,252,.96);backdrop-filter:blur(12px);border-radius:18px;padding:11px 12px;box-shadow:0 12px 30px -10px rgba(20,10,40,.35);font-size:13px}
.pushnote.fresh{animation:pndrop .5s cubic-bezier(.34,1.4,.64,1) both}
.pn-ic{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.pn-h{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px}.pn-h b{color:var(--ink);font-weight:600}
.pn-t{color:var(--ink);margin-top:1px;line-height:1.35}
@keyframes pndrop{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}

/* ================= World state & simulation ================= */
let S;
let timers = [];
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function later(ms, fn){ timers.push(setTimeout(()=>{ fn(); render(); }, ms)); }

function newState(){
  return {
    now: new Date(SIM_START),
    view: (S && S.view) || 'both',
    balance: 10235.00,
    history: seedHistory(),
    opts: { quoteMove: (S&&S.opts.quoteMove)||'up', outcome: (S&&S.opts.outcome)||'delivered', noMatchFlow: 'estimate' },
    interest: {},
    draft: null,
    savedDraft: null,
    request: null,
    added: [],
    trusted: {},
    limits: {},
    contactsAllowed: false,
    transfer: null,
    clip: null,
    snd: { stack:['home'], dir:'fade', sheet:null, toast:null, overlay:null, resolving:false },
    rcp: { screen:'invite', dir:'fade', sheet:null, toast:null, overlay:null, choice:null, method:null, f:{}, err:{}, unsure:{}, qrNote:null, docNote:null, lookup:null },
  };
}

function limitOf(cc){ return (S && S.limits && S.limits[cc]) || COUNTRIES[cc].limit; }
const tick = (min=1) => { S.now = new Date(S.now.getTime() + min*60000); };

/* ---------- navigation ---------- */
const sTop = () => S.snd.stack[S.snd.stack.length-1];
function sGo(scr){ S.snd.stack.push(scr); S.snd.dir='fwd'; S.snd.sheet=null; }
function sBack(){ if (S.snd.stack.length>1) S.snd.stack.pop(); S.snd.dir='back'; S.snd.sheet=null; }
function sReset(stack){ S.snd.stack = stack; S.snd.dir='fade'; S.snd.sheet=null; S.snd.overlay=null; }
function rGo(scr, dir='fwd'){ S.rcp.screen=scr; S.rcp.dir=dir; S.rcp.sheet=null; }
function toast(side, msg, act){ const t = {msg, act, id:Math.random()}; S[side].toast = t; setTimeout(()=>{ if (S[side].toast===t){ S[side].toast=null; render(); } }, act?5200:2800); }

/* ---------- quotes ---------- */
function marketRate(cc, phase){ // phase: 'estimate' | 'current'
  const base = COUNTRIES[cc].rate;
  if (phase==='estimate') return base;
  const m = S.opts.quoteMove; // 'up' = costs more, 'down' = costs less
  return m==='up' ? base*0.9921 : m==='down' ? base*1.0062 : base;
}
function newDraft(cc){
  return { country:cc, identifier:'', name:'', resolved:null, mode:'live', anchor:'send', anchorStr:'', active:'send',
           rate:COUNTRIES[cc].rate, quoteAt:null, validUntil:null, est:null, purpose:'Gift', manual:{ tab:'key' }, err:{}, fromRequest:false };
}
function liveQuote(d){ d.rate = marketRate(d.country,'current'); d.quoteAt = new Date(S.now); d.validUntil = new Date(S.now.getTime()+QUOTE_WINDOW_MIN*60000); }
function amounts(d){
  const c = COUNTRIES[d.country]; const v = parseFloat(d.anchorStr) || 0; let send, receive;
  if (d.anchor==='send'){ send = v; receive = c.dec===0 ? Math.floor(v*d.rate) : Math.floor(v*d.rate*100)/100; }
  else { receive = v; send = v ? ceil2(v/d.rate) : 0; }
  const fee = send>0 ? r2(c.feeFlat + send*c.feePct) : 0;
  return { send, receive, fee, total: r2(send+fee), rate:d.rate };
}
function quoteValid(d){ return d.validUntil && S.now <= d.validUntil; }
function calcIssues(d){
  const a = amounts(d), c = COUNTRIES[d.country], out = [];
  if (a.send > limitOf(c.code)) out.push({ kind:'limit', msg:`Max ${fmtUSD0(limitOf(c.code))} per transfer to ${c.name}` });
  else if (a.send>0 && a.send < 1) out.push({ kind:'min', msg:'The minimum is $1.00.' });
  if (d.mode!=='estimate' && a.total > S.balance && a.send <= limitOf(c.code)) out.push({ kind:'balance', msg:`The total is more than your ${fmtUSD(S.balance)} available.` });
  return out;
}

/* ---------- requests ---------- */
function reqId(){ return Math.random().toString(36).slice(2,7).toUpperCase(); }
function createRequest(){
  const d = S.draft, c = COUNTRIES[d.country];
  let intended = null, estSend = null, estTotal = null, estRate = null;
  if (d.mode==='ask'){ const v = parseFloat(String(d.askStr||'').replace(/,/g,'')); intended = v>0 ? (c.dec===0 ? Math.round(v) : r2(v)) : null; }
  else { const a = amounts(d); intended = a.receive; estSend = a.send; estTotal = a.total; estRate = d.rate; }
  tick(2);
  S.request = {
    id: reqId(), country:d.country, name:d.name.trim(), identifier:d.identifier.trim(),
    intendedReceive: intended, estSend, estTotal, estRate, purpose:d.purpose,
    createdAt:new Date(S.now), expiresAt:new Date(S.now.getTime()+LINK_DAYS*864e5),
    status:'awaiting', details:null, submittedAt:null, cancelledAt:null,
    channel: isEmail(d.identifier) ? 'email' : 'phone', sentVia: null, note: '',
  };
  S.request.message = defaultMessage(S.request);
  S.savedDraft = null;
  rReset();
}
function defaultMessage(r){
  const fn = firstName(r.name), amt = r.intendedReceive!=null ? fmtCur(r.intendedReceive, r.country) : 'some money';
  const why = PURPOSE_PHRASE[r.purpose] ? ' ' + PURPOSE_PHRASE[r.purpose] : '';
  return `Hi ${fn}! I’m sending you ${amt}${why} through Nu. Tap the link to add where you’d like to receive it — it only takes a couple of minutes.`;
}
function declineRequest(){
  const r = S.request; if (!r || r.status!=='awaiting') return;
  tick(1); r.status='declined'; r.declinedAt = new Date(S.now);
}
function rReset(){ Object.assign(S.rcp, { screen:'invite', dir:'fade', sheet:null, overlay:null, choice:null, method:null, f:{}, err:{}, unsure:{}, qrNote:null, docNote:null, lookup:null }); }
function cancelRequest(){
  if (!S.request) return; tick(1);
  S.request.status='cancelled'; S.request.cancelledAt = new Date(S.now);
  if (S.draft && S.draft.fromRequest) S.draft = null;
}
function checkExpiry(){
  const r = S.request;
  if (r && r.status==='awaiting' && S.now > r.expiresAt){ r.status='expired'; if (S.draft && S.draft.fromRequest) S.draft=null; }
}
function submitDetails(details){
  const r = S.request; if (!r || r.status!=='awaiting') return;
  tick(1); r.details = details; r.status='ready'; r.submittedAt = new Date(S.now);
  if (!S.added.some(x=>x.reqId===r.id)) S.added.unshift({ id:'rq'+r.id, reqId:r.id, name:r.name, country:r.country, bank:details.bank, method:details.methodLabel, masked:details.methodLabel+' · '+details.masked, when:null, nu:!!details.nu, savedAt:new Date(S.now) });
}
function resumeFromRequest(){
  const r = S.request, d = newDraft(r.country);
  d.name = r.name; d.identifier = r.identifier; d.fromRequest = true; d.mode='resume';
  d.resolved = { kind: r.details.nu?'nu':'external', name:r.details.holder, bank:r.details.bank, method:r.details.methodLabel, masked:r.details.masked };
  liveQuote(d);
  const has = r.intendedReceive!=null;
  d.anchor='receive'; d.anchorStr = has ? String(r.intendedReceive) : ''; d.active='receive'; d.fresh = has;
  d.est = r.estTotal!=null ? { send:r.estSend, total:r.estTotal, rate:r.estRate, at:r.createdAt } : null;
  S.draft = d;
}

/* ---------- transfers ---------- */
function authorize(outcome){
  const d = S.draft, a = amounts(d);
  tick(1);
  S.balance = r2(S.balance - a.total);
  const t = {
    id:'TR-' + reqId() + reqId().slice(0,3), country:d.country, recipient:{...d.resolved}, ...a,
    createdAt:new Date(S.now), stage:0, status:'processing', fromRequest:d.fromRequest, events:[{at:new Date(S.now), s:0}],
    outcome:outcome||S.opts.outcome, realStart:Date.now(),
  };
  S.transfer = t;
  if (d.fromRequest && S.request){ S.request.status='sent'; S.request.transferId=t.id; }
  S.history.unshift({ id:t.id, at:new Date(S.now), title:'Sent to '+d.resolved.name, sub:'', amount:-a.total, recv:fmtCur(a.receive,d.country), to:d.resolved.name, cc:d.country, status:'In progress', tid:t.id, icon:'abroad', flag:d.country, transfer:true });
  const rqc = d.fromRequest && S.request ? S.added.find(x=>x.reqId===S.request.id) : null;
  if (rqc){ rqc.when='Today'; S.history[0].to = rqc.name; }
  const known = rqc || [...CONTACTS.recent, ...CONTACTS.saved, ...S.added].some(x=>x.name===d.resolved.name && x.country===d.country);
  if (!known) S.added.unshift({ id:'n'+t.id, name:d.resolved.name, country:d.country, bank:d.resolved.bank, method:d.resolved.method, masked:d.resolved.masked, when:'Today', nu:d.resolved.kind==='nu' });
  S.draft = null; S.savedDraft = null;
  runTransfer();
}
function runTransfer(){
  const t = S.transfer; if (!t) return;
  later(1500, ()=>{ if (S.transfer!==t) return; t.stage=1; t.events.push({at:new Date(S.now), s:1}); });
  later(3100, ()=>{ if (S.transfer!==t) return; tick(1); t.stage=2; t.events.push({at:new Date(S.now), s:2}); });
  later(5000, ()=>{ if (S.transfer!==t) return; settle(t, t.outcome); });
}
function settle(t, outcome){
  if (outcome==='delivered'){ tick(1); t.stage=3; t.status='completed'; t.completedAt=new Date(S.now); t.realMs = Date.now() - (t.realStart||Date.now());
    const n = { id:Math.random(), bank: t.recipient.kind==='nu' ? 'Nu' : t.recipient.bank, msg:`You received ${fmtCur(t.receive,t.country)} from Ana Ribeiro.`, fresh:true }; S.rcp.notif = n;
    setTimeout(()=>{ if (S.rcp.notif===n){ S.rcp.notif=null; render(); } }, 6000); }
  else if (outcome==='delayed'){ t.status='delayed'; }
  else if (outcome==='uncertain'){ t.status='uncertain'; }
  else if (outcome==='returned'){ tick(2); t.status='returned'; t.returnedAt = new Date(S.now);
    S.balance = r2(S.balance + t.total);
    S.history.unshift({ id:t.id+'-R', at:new Date(S.now), title:'Returned · '+t.recipient.name, sub:'Refunded to your balance', amount:t.total, icon:'in' });
  }
}
function txStatusLabel(t){
  return t.status==='completed' ? 'Delivered' : t.status==='returned' ? 'Returned' : t.status==='uncertain' ? 'Confirming' : t.status==='delayed' ? 'Taking longer' : 'In progress';
}

/* ================= Sender (Ana's app) ================= */
const hdr = ({back=true, close=false, title='', right=''}={}) => `
  <div class="hdr">
    ${back ? `<button class="ib" data-act="sBack" aria-label="Back">${I.back}</button>` : '<span style="width:44px"></span>'}
    <div class="t">${title}</div>
    ${close ? `<button class="ib" data-act="sClose" aria-label="Close">${I.close}</button>` : (right || '<span style="width:44px"></span>')}
  </div>`;
const JPOS = [12, 46, 80, 100];
function journey(t, fn){
  const st = t.status, stg = t.stage, done = st==='completed';
  const pos = done ? 100 : st==='returned' ? 80 : JPOS[Math.min(stg,2)];
  const key = st + ':' + stg;
  const fresh = t.animKey !== key; const from = t.animPos ?? 0;
  t.animKey = key; t.animPos = pos;
  const celebrate = done && fresh;
  const tone = st==='returned' ? 'bad' : (st==='uncertain'||st==='delayed') ? 'warn' : done ? 'ok' : 'go';
  const conf = celebrate ? Array.from({length:18},(_,i)=>{ const a = (i/18)*Math.PI*2, d = 46+ (i%3)*14; const cols = { BR:['#1E9A4B','#FBD03B','#1F3F95'], CO:['#FCD116','#003893','#CE1126'], MX:['#006847','#ffffff','#CE1126'], ES:['#AA151B','#F1BF00','#AA151B'] }[t.country] || ['#6A1FD0','#B98BFF','#E4D8FA'];
      return `<i style="--x:${Math.round(Math.cos(a)*d)}px;--y:${Math.round(Math.sin(a)*d)}px;--r:${i*40}deg;background:${cols[i%3]};animation-delay:${80+i*8}ms"></i>`; }).join('') : '';
  const recv = fmtCur(t.receive, t.country);
  return `<div class="journey ${tone} ${fresh?'fresh':''} ${celebrate?'celebrate':''}" style="--from:${from}%;--to:${pos}%">
      <div class="jr-end"><div class="jr-flag">${FLAGS.US || flag('US')}</div><div class="jr-amt">${fmtUSD(t.send)}</div><div class="jr-lbl">You</div></div>
      <div class="jr-track"><div class="jr-line"></div><div class="jr-fill"></div><div class="jr-dot">${done?I.check:''}</div></div>
      <div class="jr-end dest"><div class="jr-flag">${FLAGS[t.country]}<span class="jr-ring"></span><span class="jr-conf">${conf}</span></div>
        <div class="jr-amt jr-stack" ${stg>=1||done?'':'style="opacity:.35"'}><span class="jr-ghost" aria-hidden="true">${recv}</span><span class="jr-live" ${stg<1&&!done?'data-ph="1"':''} ${(()=>{ if (fresh && stg===1 && !done) t.countT0 = performance.now(); return t.countT0 && performance.now()-t.countT0 < 1400 ? `data-countup="${t.receive}" data-cc="${t.country}" data-t0="${t.countT0}"` : ''; })()}>${stg<1&&!done ? COUNTRIES[t.country].cur+' ···' : recv}</span></div><div class="jr-lbl">${esc(fn)}</div></div>
    </div>`;
}
function nameCheckReq(r){
  const n = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
  return r && r.details && r.name && n(r.name)!==n(r.details.holder) ? (nameMatches(r.details.holder, r.name) ? 'close' : 'diff') : null;
}
function nameCheck(){
  const d = S.draft, r = S.request;
  if (!d || !d.fromRequest || !r || !r.details || !r.name) return null;
  const n = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
  const saved = r.name, acct = r.details.holder;
  if (n(saved)===n(acct)) return null;
  return { saved, acct, kind: nameMatches(acct, saved) ? 'close' : 'diff' };
}
const recipientName = () => (S.draft && (S.draft.resolved?.name || S.draft.name || S.draft.identifier)) || 'them';

function senderScreen(){
  const needsDraft = ['recipient','resolved','nomatch','manual','calc','request','review'];
  if (needsDraft.includes(sTop()) && !S.draft){ S.snd.stack = ['home', ...(S.request && S.request.status!=='sent' ? ['reqstatus'] : [])]; S.snd.overlay=null; }
  if (sTop()==='share' && !(S.request && S.request.status==='awaiting')) S.snd.stack = ['home', ...(S.request?['reqstatus']:[])];
  if (sTop()==='receipt' && !(S.transfer && S.transfer.status==='completed')) S.snd.stack = ['home'];
  const s = sTop();
  const fn = SENDER[s] || SENDER.home;
  return fn();
}

      <div style="padding:0 20px 24px">
        ${cards.length ? `<div class="eyebrow">In progress</div><div class="stack">${cards.join('')}</div>` : ''}
        <div class="eyebrow">Activity</div>
        <div class="list">${items}</div>
      </div>
    </div>
  </div>`;
},

send(){
  return `<div class="scr">${hdr({close:true})}
    <div class="body">
      <h1 class="title">Send money</h1>
      <p class="lead">Choose where the money is going.</p>
      <div class="list">
        <button class="li" data-act="na"><div class="av neutral">${I.home}</div><div class="main"><div class="l1">Within the U.S.</div><div class="l2">To a U.S. bank account or a Nu customer</div></div>${I.chev}</button>
        <button class="li" data-act="sGo" data-arg="dest"><div class="av">${I.globe}</div><div class="main"><div class="l1">Abroad</div><div class="l2">Brazil, Colombia, Mexico and Spain</div></div>${I.chev}</button>
      </div>
      <p class="hint" style="margin-top:14px">Sending abroad uses your USD balance. We convert it and pay out in the local currency.</p>
    </div></div>`;
},

dest(){
  const rows = COUNTRY_ORDER.map(cc=>{ const c=COUNTRIES[cc];
    return `<button class="li" data-act="pickCountry" data-arg="${cc}">${flag(cc)}<div class="main"><div class="l1">${c.name} <span class="muted" style="font-weight:500">· ${c.cur}</span></div><div class="l2">${c.methods}</div></div>${I.chev}</button>`; }).join('');
  const more = INTEREST.map(([cc,n])=>{ const on = S.interest[cc];
    return `<div class="li">${flag(cc)}<div class="main"><div class="l1">${n}</div><div class="l2">${on?'We’ll let you know if this changes':'Not available yet'}</div></div>
      <button class="chip ${on?'on':''}" data-act="interest" data-arg="${cc}" aria-pressed="${!!on}">${on?'Interested':'Show interest'}</button></div>`; }).join('');
  return `<div class="scr">${hdr({close:true})}
    <div class="body">
      <h1 class="title">Where are you sending?</h1>
      <div class="list">${rows}</div>
      <div class="eyebrow">Not available yet</div>
      <div class="list">${more}</div>
    </div></div>`;
},

recipient(){
  const d = S.draft, c = COUNTRIES[d.country], q = d.identifier.trim(), ql = q.toLowerCase();
  const all = [...S.added.map(x=>({...x,grp:'Recent'})), ...CONTACTS.recent.map(x=>({...x,grp:'Recent'})), ...CONTACTS.saved.map(x=>({...x,grp:'Saved'}))];
  const match = x => !q || x.name.toLowerCase().includes(ql) || x.masked.toLowerCase().includes(ql) || x.bank.toLowerCase().includes(ql);
  const row = x => `<div class="lirow"><button class="li" data-act="pickContact" data-arg="${x.id}">
      <div class="av">${initials(x.name)}<span class="flag">${FLAGS[x.country]}</span></div>
      <div class="main"><div class="l1">${x.name}${isTrusted(x.name,x.country)?' <span class="tag green" style="height:18px;font-size:10px">Trusted</span>':''}</div><div class="l2">${x.bank} · ${x.masked.replace(/^.*?· /,'')}</div></div>
      ${x.when?`<span class="small muted">${x.when}</span>`:''}</button><button class="ib info" data-act="openContact" data-arg="${x.id}" aria-label="${x.name} details">${I.info}</button></div>`;
  const groups = ['Recent','Saved'].map(g=>{ const xs = all.filter(x=>x.grp===g && match(x));
    return xs.length ? `<div class="eyebrow">${q ? 'Matching '+g.toLowerCase()+' contacts' : g}</div><div class="list">${xs.map(row).join('')}</div>` : ''; }).join('');
  const L = d.lookup && d.lookup.for===q ? d.lookup : null;
  let result = '';
  if (L && L.state==='searching') result = `<div class="list"><div class="li"><div class="av neutral"><span class="spin"></span></div><div class="main"><div class="l1">Looking for an account…</div><div class="l2">${esc(q)} · ${c.name}</div></div></div></div>`;
  if (L && L.state==='hit'){ const x = L.hit;
    result = `<div class="eyebrow">Account found</div><div class="list"><button class="li" data-act="pickLookup">
      <div class="av">${initials(x.name)}<span class="flag">${FLAGS[d.country]}</span></div>
      <div class="main"><div class="l1">${esc(x.name)}</div><div class="l2">${x.kind==='nu'?'Nu account':esc(x.bank)} · ${esc(x.masked.replace(/^.*?· /,''))}</div></div>
      ${x.kind==='nu'?'<span class="tag purple">Nu</span>':''}${I.chev}</button></div>
      <div class="hint" style="margin-top:6px">Name as returned by the lookup. <span class="sim">Simulated lookup</span></div>`; }
  if (L && L.state==='none') result = `<div class="list"><button class="li" data-act="toNoMatch"><div class="av neutral">${I.user}</div>
      <div class="main"><div class="l1">No account found</div><div class="l2">${d.country==='ES'?'Add their IBAN, or ask them for it':(d.country==='BR'&&/^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$/.test(q))?'This CPF isn’t registered as a Pix key — ask them for their details':'You can still send — ask them for their details'}</div></div>${I.chev}</button></div>`;
  const keepTyping = q && !L && !groups ? `<div class="hint" style="margin-top:10px">${d.country==='BR'?'Keep typing a full email, phone with +55, CPF or Pix key.':'Keep typing a full email, or a phone number with the country code.'}</div>` : '';
  return `<div class="scr">${hdr({close:true})}
    <div class="body">
      <h1 class="title">Who are you sending to in ${c.name}?</h1>
      <div class="field" style="margin-top:14px">
        <label for="ident">${d.country==='BR'?'Name, email, phone, CPF or Pix key':'Name, email or phone number'}</label>
        <input id="ident" class="input ${d.err.identifier?'err':''}" data-bind="draft.identifier" value="${esc(d.identifier)}" placeholder="${d.country==='BR'?'Search, or enter email, +55…, CPF or key':'Search or enter email / +'+{CO:57,MX:52,ES:34}[d.country]+'…'}" autocomplete="off" data-enter="lookup">
        ${d.err.identifier?`<div class="errmsg">${d.err.identifier}</div>`:(L?'':`<div class="hint">${c.idHelp}</div>`)}
      </div>
      ${!q ? `<button class="btn secondary" style="margin-top:12px;height:48px" data-act="pickDevice">${I.user} Choose from your phone’s contacts</button>` : ''}
      ${d.fromDevice ? `<div class="hint" style="margin-top:6px">${esc(d.name)} from your contacts</div>` : ''}
      ${result ? `<div style="margin-top:12px">${result}</div>` : ''}
      ${keepTyping}
      ${L && L.state==='hit' ? '' : `<button class="link" data-act="manualFromRecipient">${I.bank.replace('<svg','<svg style="width:18px;height:18px;vertical-align:-4px;margin-right:6px"')}Enter bank details</button>`}
      ${groups}
    </div>
  </div>`;
},

resolved(){
  const d = S.draft, x = d.resolved, c = COUNTRIES[d.country];
  const isNu = x.kind==='nu';
  return `<div class="scr">${hdr({close:true})}
    <div class="body">
      <h1 class="title">Is this the right person?</h1>
      <p class="lead">Check the name before you continue.</p>
      <div class="card" style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 16px">
        <div class="av lg">${initials(x.name)}<span class="flag">${FLAGS[d.country]}</span></div>
        <div style="font-size:20px;font-weight:650;margin-top:4px">${esc(x.name)}</div>
        <div class="row" style="gap:6px">${isNu?'<span class="tag purple">Nu account</span>':`<span class="tag gray">${esc(x.bank)}</span>`}<span class="tag gray">${c.name}</span></div>
        <div class="small muted num">${esc(x.masked)}</div>
      </div>
      <div class="note neutral" style="margin-top:14px">${I.info}<div>${isNu
        ? `${firstName(x.name)} banks with Nu in ${c.name}. Money usually arrives within minutes.`
        : `Matched through ${esc(x.method.split(' (')[0])}. The money goes to ${firstName(x.name)}’s account at ${esc(x.bank)}.`}
        <div class="small" style="margin-top:4px;opacity:.85">Name as returned by the lookup. <span class="sim">Simulated lookup</span></div></div></div>
    </div>
    <div class="foot">
      <button class="btn primary" data-act="toCalcLive">Yes, continue</button>
      <button class="btn ghost" data-act="notThem">Not them</button>
    </div></div>`;
},

nomatch(){
  const d = S.draft, c = COUNTRIES[d.country], fn = d.name.trim() ? firstName(d.name) : 'them';
  const isES = d.country==='ES';
  const what = d.identifier.includes('@') ? 'email' : 'number';
  return `<div class="scr">${hdr({close:true})}
    <div class="body">
      <h1 class="title">${isES ? 'Spain needs bank details' : `No account found for this ${what}`}</h1>
      <div style="margin:2px 0 12px"><span class="tag gray" style="height:28px;font-size:13px">${esc(d.identifier)}</span></div>
      <p class="lead">${isES ? c.idHelp : (d.country==='MX' && what==='email' ? `In Mexico, bank accounts can’t be found by email — only by CLABE or a mobile number registered for transfers. Nothing has been sent, and you can still send to ${fn}.` : `That’s common — not everyone links their ${what} for payments. Nothing has been sent, and you can still send to ${fn}.`)}</p>
      <div class="eyebrow">How do you want to continue?</div>
      <div class="stack">
        <button class="opt featured" data-act="chooseAsk">
          <div class="row" style="justify-content:space-between"><span class="h">Ask for their details</span><span class="tag purple">Recommended</span></div>
          <div class="small" style="color:var(--ink-2)">We’ll make a secure link for you to share. They add where to receive the money, then you review and send.</div>
        </button>
        <button class="opt" data-act="chooseManual">
          <span class="h">Enter their bank details</span>
          <div class="small" style="color:var(--ink-2)">If you already have their ${{BR:'Pix key or bank details',CO:'Bre-B key',MX:'CLABE',ES:'IBAN'}[d.country]}.</div>
        </button>
      </div>
    </div></div>`;
},

manual(){
  const d = S.draft, cc = d.country, m = d.manual, e = d.err;
  const f = (id, label, ph, extra='') => `<div class="field"><label for="m_${id}">${label}</label>
    <input id="m_${id}" class="input ${e[id]?'err':''}" data-bind="draft.manual.${id}" value="${esc(m[id]||'')}" placeholder="${ph}" autocomplete="off" ${extra}>
    ${e[id]?`<div class="errmsg">${e[id]}</div>`:''}</div>`;
  let form = '';
  if (cc==='BR') form = `<div class="seg" role="tablist"><button class="${m.tab==='key'?'on':''}" data-act="mTab" data-arg="key">Pix key</button><button class="${m.tab==='bank'?'on':''}" data-act="mTab" data-arg="bank">Bank account</button></div>` +
    (m.tab==='key' ? f('key','Pix key','CPF, phone, email or random key') + '<div class="hint">A Pix key is the simplest way to pay a Brazilian account.</div>'
     : f('bank','Bank','e.g. Itaú') + `<div class="row" style="gap:10px;align-items:flex-start"><div style="flex:1">${f('agency','Branch','0000')}</div><div style="flex:1.4">${f('account','Account','00000-0')}</div></div>` + f('cpf','Holder CPF','000.000.000-00'));
  if (cc==='CO') form = f('key','Bre-B key','Phone, ID number, email or @key');
  if (cc==='MX') form = f('key','CLABE','18 digits', 'inputmode="numeric"') + '<div class="hint">The 18-digit interbank number from their banking app.</div>';
  if (cc==='ES') form = f('key','IBAN','ES00 0000 0000 0000 0000 0000');
  return `<div class="scr">${hdr({close:true})}
    <div class="body">
      <h1 class="title">${d.name.trim()?esc(firstName(d.name))+'’s':'Their'} bank details</h1>
      <p class="lead">Sending to ${COUNTRIES[cc].name}.</p>
      <div class="stack">
        ${f('holder','Account holder name','Name on their bank account', `maxlength="${NAME_MAX}"`)}
        ${e.holder?'':'<div class="hint" style="margin-top:-6px">Saved to your contacts under this name.</div>'}
        ${form}
      </div>
    </div>
    <div class="foot"><button class="btn primary" data-act="manualSubmit">Continue</button></div></div>`;
},

calc(){
  const d = S.draft, c = COUNTRIES[d.country], a = amounts(d), issues = calcIssues(d);
  const est = d.mode==='estimate', res = d.mode==='resume';
  const nm = clip(recipientName(), 26), fn = firstName(recipientName()), getsLbl = fn==='them' ? 'They get' : `${esc(fn)} gets`;
  const fsz = side => { const txt = side==='send' ? (d.active==='send'&&d.anchor==='send'&&!d.fresh ? '$'+(d.anchorStr||'0') : fmtUSD(a.send)) : (d.active==='receive'&&d.anchor==='receive'&&!d.fresh ? c.sym+(d.anchorStr||'0') : fmtCur(a.receive,d.country)); const L = txt.length; return L>13?20:L>11?24:L>9?28:32; };
  const val = (side) => {
    const on = d.active===side, isAnchor = d.anchor===side;
    if (on && isAnchor && !d.fresh){ const s = d.anchorStr || '0'; const sym = side==='send'?'$':c.sym;
      return `${sym}${s.replace(/\B(?=(\d{3})+(?!\d))/g, ',')}<span class="caret"></span>`; }
    return (side==='send' ? fmtUSD(a.send) : fmtCur(a.receive, d.country)) + (on?'<span class="caret"></span>':'');
  };
  const limitErr = issues.find(i=>i.kind==='limit'||i.kind==='min');
  const capHint = `Up to ${fmtUSD0(limitOf(c.code))} per transfer to ${c.name} · ${fmtUSD(S.balance)} available`;
  const balErr = issues.find(i=>i.kind==='balance');
  let banner = '';
  if (res && !d.est) banner = `<div class="note neutral" style="padding:9px 12px;font-size:13px">${I.refresh}<div>${esc(fn)}’s details are in. This is your current quote${d.anchorStr?'':' — enter an amount'}.</div></div>`;
  if (res && d.est){
    const diff = r2(a.total - d.est.total); const estWhen = fmtDate(d.est.at)===fmtDate(S.now) ? fmtTime(d.est.at) : fmtDate(d.est.at);
    banner = Math.abs(diff) < 0.01
      ? `<div class="note neutral" style="padding:9px 12px;font-size:13px">${I.refresh}<div>Current quote. Same total as your ${estWhen} estimate.</div></div>`
      : `<div class="note ${diff>0?'neutral':'ok'}" style="padding:9px 12px;font-size:13px">${I.refresh}<div>Rate updated since your ${estWhen} estimate. ${fmtCur(a.receive,d.country)} now costs <b>${fmtUSD(Math.abs(diff))} ${diff>0?'more':'less'}</b> in total.</div></div>`;
  }
  if (est){
    const email = isEmail(d.identifier), isMX = d.country==='MX', isES = d.country==='ES';
    const why = isES ? 'Payments in Spain go to an IBAN — we’ll ask them for it.' : (isMX && email) ? 'In Mexico, accounts are linked to mobile numbers, not email — we’ll ask them where to send it.' : `This ${email?'email':'number'} isn’t linked to an account yet — we’ll ask them where to send it.`;
    banner = `<div class="missbanner"><div class="mb-h">${I.check} We’ll get their details for you</div><div class="mb-t">${why}</div>
      <div class="mb-l"><button class="link" data-act="retrySearch">${email&&isMX?'Use their mobile number':'Try a different '+(email?'email':'number')}</button><button class="link" data-act="chooseManual">Enter bank details</button></div></div>`;
  }
  if (limitErr && limitErr.kind==='limit') banner = `<div class="note warn" style="padding:9px 12px;font-size:13px">${I.info}<div>You can send up to <b>${fmtUSD0(limitOf(c.code))}</b> to ${c.name} in one transfer. Lower the amount to continue.</div></div>`;
  if (d.prevQuote && !(limitErr && limitErr.kind==='limit')){ const df = r2(a.total - d.prevQuote.total);
    banner = `<div class="note ${df>0?'neutral':'ok'}" style="padding:9px 12px;font-size:13px">${I.refresh}<div>Quote refreshed. ${Math.abs(df)<0.01 ? `${fmtCur(a.receive,d.country)} costs the same as before.` : `${fmtCur(a.receive,d.country)} now costs <b>${fmtUSD(Math.abs(df))} ${df>0?'more':'less'}</b> in total.`}</div></div>`; }
  const nc = res ? nameCheck() : null;
  if (nc && nc.kind==='diff' && !(limitErr && limitErr.kind==='limit')) banner = `<div class="note warn" style="padding:9px 12px;font-size:13px">${I.alert}<div><b>Account name doesn’t match.</b> It’s ${esc(nc.acct)}, not ${esc(nc.saved)}. Check before you send.</div></div>`;
  const sub = nc ? `<span style="${nc.kind==='diff'?'color:var(--amber);font-weight:600':''}">Account: ${esc(clip(nc.acct,22))}</span> · ${esc(d.resolved.bank)}` : d.resolved ? `${esc(d.resolved.bank)} · ${esc(d.resolved.method)}` : 'Details to come';
  return `<div class="scr">
    <div class="hdr" style="min-height:96px;padding-bottom:2px">
      <button class="ib" data-act="sBack" aria-label="Back">${I.back}</button>
      <div class="to-chip" style="flex:1;padding:0 4px">
        <div class="av" style="width:34px;height:34px;font-size:12px">${nc?initials(nc.saved):isNameLike(recipientName())?initials(nm):I.user.replace('<svg','<svg style="width:16px;height:16px"')}<span class="flag" style="width:15px;height:15px">${FLAGS[d.country]}</span></div>
        <div style="min-width:0"><div class="n">${nc ? 'To '+esc(clip(nc.saved,26)) : isNameLike(recipientName()) ? 'To '+esc(nm) : 'To '+c.name}</div><div class="s">${d.resolved ? sub : c.cur+' · details to come'}</div></div>
      </div>
      <button class="ib" data-act="sClose" aria-label="Close">${I.close}</button>
    </div>
    <div class="calc">
      <button class="amtbox ${d.active==='send'?'on':''}" data-act="setActive" data-arg="send" aria-label="You send">
        <div class="cur">${flag('US')}<div><div class="lbl">You send</div><div class="code">USD</div></div></div>
        <div class="val" style="font-size:${fsz('send')}px${limitErr&&limitErr.kind==='limit'?';color:var(--amber)':''}">${val('send')}</div></button>
      <button class="amtbox ${d.active==='receive'?'on':''}" data-act="setActive" data-arg="receive" aria-label="${esc(fn)} gets">
        <div class="cur">${flag(d.country)}<div><div class="lbl">${getsLbl}</div><div class="code">${c.cur}</div></div></div>
        <div class="val" style="font-size:${fsz('receive')}px">${val('receive')}</div></button>
      <div class="quote">
        <button class="kv kvbtn" data-act="rateInfo"><span class="k">${est?'Estimated rate':'Rate'} ${lockTag(d)}</span><span class="v">${est?'≈ ':''}${fmtRate(d.rate,d.country)}</span></button>
        <button class="kv kvbtn" data-act="toggleFees"><span class="k">Fee <span class="more">Breakdown ${I.chevDown}</span></span><span class="v">${fmtUSD(a.fee)}</span></button>
        <div class="kv"><span class="k">${est?'Estimated total':'Total charged'}</span><span class="v">${fmtUSD(a.total)}</span></div>
        ${est?'':`<div class="kv"><span class="k">Arrives</span><span class="v" style="font-weight:550">${c.delivery}</span></div>`}
      </div>
      ${`${banner}
      <div class="keyinfo">
        <span class="${balErr?'warn':''}">Available <b>${fmtUSD(S.balance)}</b></span>
        <span class="${limitErr?'warn':''}">${limitErr && limitErr.kind==='min' ? 'Minimum <b>$1.00</b>' : `Max <b>${fmtUSD0(limitOf(c.code))}</b> per transfer`}</span>
      </div>
      <div class="keypad" role="group" aria-label="Keypad">
        ${['1','2','3','4','5','6','7','8','9','.','0','del'].map(k=>`<button class="key" data-act="key" data-arg="${k}" aria-label="${k==='del'?'Delete':k}">${k==='del'?I.del:k}</button>`).join('')}
      </div>`}
    </div>
    <div class="foot" style="padding-top:8px"><button class="btn primary" data-act="calcNext" ${(a.send<=0||limitErr)?'disabled':''}>${est?'Continue':'Review'}</button></div>
  </div>`;
},

request(){
  const d = S.draft, c = COUNTRIES[d.country], a = amounts(d), email = isEmail(d.identifier);
  const purposes = ['Gift','Family support','Paying back','Rent','Other'];
  return `<div class="scr">${hdr({close:true})}
    <div class="body">
      <h1 class="title">Set up your transfer</h1>
      <div class="card" style="margin-top:6px">
        <div class="kv"><span class="k">They get</span><span class="v" style="font-size:18px">${fmtCur(a.receive,d.country)}</span></div>
        <div class="kv"><span class="k">About</span><span class="v">${fmtUSD(a.total)} incl. fee</span></div>
        <div class="small muted" style="padding-top:6px">Nothing is charged until you confirm. You’ll see the final rate first.</div>
      </div>
      <div class="field" style="margin-top:18px">
        <label for="rname">What’s their name?</label>
        <input id="rname" class="input ${d.err.name?'err':''}" data-bind="draft.name" value="${esc(d.name)}" placeholder="Their full name" maxlength="${NAME_MAX}" autocomplete="off">
        ${d.err.name?`<div class="errmsg">${d.err.name}</div>`:`<div class="hint">${d.fromDevice?'From your phone’s contacts. ':''}So they know it’s from you. We’ll save them as a Nu contact too.</div>`}
      </div>
      <div class="eyebrow">What’s it for? <span style="text-transform:none;letter-spacing:0;font-weight:500">· optional, they’ll see it</span></div>
      <div class="chips">${purposes.map(p=>`<button class="chip ${d.purpose===p?'on':''}" data-act="purpose" data-arg="${p}">${p}</button>`).join('')}</div>
      <div class="eyebrow">What happens next</div>
      <div class="stack" style="gap:12px">
        <div class="row" style="align-items:flex-start"><span class="stepnum">1</span><div><b>${email?'We email them a secure link':'You send them a quick message'}</b><div class="small muted">${email?`To ${esc(d.identifier)}.`:'We’ve written it for you — one tap to send.'}</div></div></div>
        <div class="row" style="align-items:flex-start"><span class="stepnum">2</span><div><b>They add where to receive it</b><div class="small muted">About a minute. No Nu account needed.</div></div></div>
        <div class="row" style="align-items:flex-start"><span class="stepnum">3</span><div><b>You confirm, and it’s on its way</b><div class="small muted">We’ll let you know the moment they’re done.</div></div></div>
      </div>
    </div>
    <div class="foot"><button class="btn primary" data-act="createRequest">Set it up</button></div></div>`;
},

share(){
  const r = S.request, fn = firstName(r.name);
  if (r.channel==='email') return `<div class="scr">${hdr({})}
    <div class="body"><h1 class="title">Send it yourself too</h1><p class="lead">We’ve already emailed ${esc(fn)}. If you’d like, send the link from your phone as well.</p>
      ${shareBlock('request.message', r.message, 'shareVia', r.id)}</div>
    <div class="foot"><button class="btn primary" data-act="sBack">Done</button></div></div>`;
  return `<div class="scr">${hdr({back:false, right:`<button class="ib" data-act="toStatus" aria-label="Close">${I.close}</button>`})}
    <div class="body">
      <h1 class="title">Share with ${esc(fn)}</h1>

reqstatus(){
  const r = S.request; if (!r) return SENDER.home();
  if (r.status==='sent' && S.transfer) return SENDER.processing();
  const c = COUNTRIES[r.country], fn = firstName(r.name);
  const st = r.status;
  const tagMap = { awaiting:['purple','Waiting for '+fn], ready:['green','Ready to send'], cancelled:['gray','Cancelled'], expired:['gray','Expired'], declined:['amber','Not recognised'] };
  const [tc, tl] = tagMap[st] || ['gray', st];
  const step = (cls, s1, s2) => `<div class="step ${cls}"><div class="dot">${cls==='done'?I.check:''}</div><div><div class="s1">${s1}</div>${s2?`<div class="s2">${s2}</div>`:''}</div></div>`;
  let tl_ = '';
  const via = { email:'We emailed '+fn, sms:'You sent it by text', whatsapp:'You sent it on WhatsApp', copy:'You copied the link' }[r.sentVia];
  const remindDay = new Date((r.sentAt||r.createdAt).getTime()+2*864e5);
  const inline = `<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">${r.channel==='email'?`<button class="chip" data-act="resendEmail">Email again</button>`:(r.sentVia?`<button class="chip on" data-act="remind">Send a reminder</button>`:`<button class="chip on" data-act="sGo" data-arg="share">Send the message</button>`)}<button class="chip" data-act="copyLink">${I.copy.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:4px"')}Copy link</button></div>
    <div class="s2" style="margin-top:6px">${r.channel==='email'?(r.remindedAt?`We reminded ${esc(fn)} ${relDay(r.remindedAt,S.now).toLowerCase()}`:`We’ll remind ${esc(fn)} on ${fmtDate(remindDay)} if needed`):`We’ll remind you on ${fmtDate(remindDay)} if needed`}</div>`;
  if (st==='awaiting') tl_ = step(r.sentVia?'done':'now', via || 'Send them the message', r.sentVia ? fmtDT(r.sentAt||r.createdAt) : 'Not sent yet')
    + (r.openedAt ? step('done', `${esc(fn)} opened the link`, fmtDT(r.openedAt)) : '')
    + `<div class="step ${r.sentVia?'now':'todo'}"><div class="dot"></div><div><div class="s1">${esc(fn)} adds where to receive it</div><div class="s2">About a minute for them · link open until ${fmtDate(r.expiresAt)}</div>${r.sentVia||r.channel==='email'?inline:''}</div></div>`
    + step('todo','You confirm','') + step('todo','Delivered','');
  if (st==='ready') tl_ = step('done', via || 'Link shared', fmtDT(r.sentAt||r.createdAt)) + step('done',`${fn} added their details`+(r.details && nameCheckReq(r) ? ` · account: ${esc(r.details.holder)}` : ''),fmtDT(r.submittedAt)) + step('now','You confirm','Ready when you are') + step('todo','Delivered','');
  if (st==='cancelled') tl_ = step('done','Request created',fmtDT(r.createdAt)) + `<div class="step"><div class="dot" style="border-color:#B9B3C4">${''}</div><div><div class="s1">Cancelled by you</div><div class="s2">${fmtDT(r.cancelledAt)} · link deactivated</div></div></div>`;
  if (st==='declined') tl_ = step('done','Request created',fmtDT(r.createdAt)) + `<div class="step"><div class="dot" style="border-color:#B9B3C4"></div><div><div class="s1">${esc(fn)} didn’t recognise this request</div><div class="s2">${fmtDT(r.declinedAt)} · link closed, no details shared</div></div></div>`;
  if (st==='expired') tl_ = step('done','Request created',fmtDT(r.createdAt)) + `<div class="step"><div class="dot" style="border-color:#B9B3C4"></div><div><div class="s1">Link expired</div><div class="s2">${fmtDT(r.expiresAt)} · no details were added, so reminders stopped</div></div></div>`;
  const next = st==='awaiting' ? fn : st==='ready' ? 'You' : 'No one';
  const det = r.details && st!=='cancelled' && st!=='expired' ? `<div class="card" style="margin-top:14px"><div class="small muted" style="margin-bottom:6px">Receiving details</div>
      <div style="font-weight:650">${esc(r.details.holder)}</div><div class="small" style="color:var(--ink-2)">${esc(r.details.bank)} · ${esc(r.details.masked)}</div>${st==='ready'?`<div class="small muted" style="margin-top:8px">${I.check.replace('<svg','<svg style="width:12px;height:12px;vertical-align:-1px;color:var(--green)"')} Saved to your contacts — send whenever you’re ready, with a current quote.</div>`:''}</div>` : '';
  let actions = '';
  if (st==='awaiting') actions = `<button class="btn ghost" style="color:var(--red)" data-act="askCancel">Cancel transfer</button>`;
  if (st==='ready') actions = `<button class="btn primary" data-act="resume">Review and send</button><button class="btn ghost" style="color:var(--red)" data-act="askCancel">Cancel transfer</button>`;
  if (st==='cancelled'||st==='expired'||st==='declined') actions = `<button class="btn primary" data-act="restartRequest">Send a new request</button><button class="btn ghost" data-act="goHome">Done</button>`;
  return `<div class="scr">${hdr({title:'Transfer'})}
    <div class="body">
      <div class="row" style="margin:4px 0 16px"><div class="av lg">${initials(r.name)}<span class="flag">${FLAGS[r.country]}</span></div>
        <div style="flex:1"><div style="font-size:20px;font-weight:650">${esc(r.name)}</div><div class="small muted">${c.name} · ${esc(r.purpose)}</div></div></div>
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="small muted">${fn} gets</div><div style="font-size:${r.intendedReceive!=null?28:20}px;font-weight:650;letter-spacing:-.02em" class="num">${fmtCurX(r.intendedReceive,r.country)||'Amount set when you send'}</div></div><span class="tag ${tc}">${tl}</span></div>
        <div class="small muted" style="margin-top:4px">${st==='cancelled'||st==='expired'||st==='declined' ? 'Nothing was sent or charged.' : (r.estTotal!=null ? `Estimated ${fmtUSD(r.estTotal)} total · not charged` : 'Rate and fee confirmed when you send · nothing charged')}</div>
      </div>
      ${st==='awaiting'||st==='ready' ? '' : `<div class="card" style="margin-top:12px"><div class="kv"><span class="k">Link</span><span class="v">Deactivated</span></div></div>`}
      ${det}
      <div class="eyebrow">Progress</div>
      <div class="tl">${tl_}</div>
      ${st==='awaiting'||st==='ready' ? `<div class="note neutral" style="margin-top:18px">${I.lock}<div>Nothing is charged until you confirm. You’ll see the final rate first.</div></div>`:''}
    </div>
    <div class="foot">${actions}</div></div>`;
},

        <label class="optin" style="margin-top:10px;color:var(--ink)"><input type="checkbox" ${d.nameAck?'checked':''} data-act="nameAck"> <span>I know this account is right</span></label></div></div>` : ''}
      <div class="card" style="margin-top:12px">

        <div class="kv total"><span class="k">Total charged</span><span class="v">${fmtUSD(a.total)}</span></div>
      </div>
      <div class="card" style="margin-top:12px">
        <button class="kv kvbtn" data-act="rateInfo"><span class="k">Rate ${lockTag(d)}</span><span class="v">${fmtRate(d.rate,d.country)}</span></button>

      </div>
      <div style="margin-top:12px" class="stack">
        ${expired ? `<div class="note warn">${I.clock}<div><b>This quote ended at ${fmtTime(d.validUntil)}.</b> Get a current quote to continue. ${fn} still gets ${fmtCur(a.receive,d.country)}.</div></div>` : ''}
        ${overLimit && !expired ? `<div class="note warn">${I.info}<div><b>The limit for ${c.name} is now ${fmtUSD0(limitOf(d.country))} per transfer.</b> Lower the amount to continue.</div></div>` : ''}
        ${insufficient && !expired && !overLimit ? `<div class="note bad">${I.alert}<div><b>You need ${fmtUSD(r2(a.total - S.balance))} more for this transfer.</b> You have ${fmtUSD(S.balance)} available. Lower the amount or add money.</div></div>` : ''}
      </div>

        needAck ? `<button class="btn primary" disabled>${I.face.replace('viewBox','style="width:22px;height:22px" viewBox')} Send with Face ID</button>
         <div class="small muted" style="text-align:center">Confirm the account name above to continue.</div>` :
        trustedForDraft(d) && !(nc && nc.kind==='diff') ? `<button class="btn primary" data-act="sendTrusted">Send ${fmtCur(a.receive,d.country)}</button>

processing(){
  const t = S.transfer; if (!t) return SENDER.home();
  const c = COUNTRIES[t.country], fn = firstName(t.recipient.name), bank = t.recipient.bank;
  const isNu = t.recipient.kind==='nu';
  const via = isNu ? 'Nu' : `${bank}${c.rail?` via ${c.rail}`:''}`;
  const st = t.status, stg = t.stage;
  let head, sub, badge='';
  if (st==='completed'){ head='Delivered'; sub=`${fmtCur(t.receive,t.country)} arrived in ${fn}’s ${isNu?'Nu':esc(bank)} account.`; }
  else if (st==='returned'){ head='Returned to you'; sub=`${esc(bank)} couldn’t credit the account. ${fmtUSD(t.total)} is back in your balance.`; }
  else if (st==='uncertain'){ head='Confirming with '+esc(bank); sub='We don’t have a final answer from the receiving bank yet.'; }
  else if (st==='delayed'){ head='Taking longer than usual'; sub=`${esc(bank)} hasn’t confirmed yet.`; }
  else { head = ['Payment authorized','Converting your money','Sending to '+esc(bank)][stg] || 'Sending'; sub = stg<2 ? 'This usually takes a moment.' : `Waiting for ${esc(bank)} to confirm.`; }
  const step = (i, s1, s2) => {
    let cls = stg>i || (stg===i && i===0) ? 'done' : stg===i ? 'now' : 'todo';
    if (i===3 && st==='completed') cls='done';
    if (i===2 && stg>=2 && st!=='completed'){ cls = st==='returned' ? 'bad' : (st==='uncertain'||st==='delayed') ? 'warn' : 'now'; }
    if (i===2 && st==='completed') cls='done';
    const fl = i===3 && st==='completed';
    const ic = fl ? FLAGS[t.country] : cls==='done'?I.check : cls==='bad'?I.close : cls==='warn'?I.clock:'';
    return `<div class="step ${cls}${fl?' flagstep':''}"><div class="dot">${ic}</div><div><div class="s1">${s1}</div>${s2?`<div class="s2">${s2}</div>`:''}</div></div>`;
  };
  const ev = i => { const e = t.events.find(e=>e.s===i); return e ? fmtTime(e.at) : ''; };
  const tl_ = step(0,'Authorized',`${fmtUSD(t.total)} from your balance · ${ev(0)}`)
    + step(1,`Converted to ${c.cur}`, stg>=1?`At ${fmtRate(t.rate,t.country)}`:'')
    + step(2, st==='returned'?'Returned by '+esc(bank):`Sent to ${via}`, st==='returned'?'Refunded to your balance':st==='uncertain'?'Status not confirmed yet':st==='delayed'?'Waiting for confirmation':stg>=2?(st==='completed'?ev(2):'Waiting for confirmation'):'')
    + (st==='returned' ? '' : step(3,'Delivered', st==='completed'?`Confirmed by ${isNu?'Nu':esc(bank)} · ${fmtTime(t.completedAt)}`:''));
  let note='', next='', actions='';
  if (st==='processing'){ next = stg<2 ? 'Nu converts your money' : bank+' confirms receipt'; actions=`<button class="btn secondary" data-act="goHome">Back to home</button>`; }
  if (st==='delayed'){ next = bank+' confirms receipt'; note = `<div class="note warn">${I.clock}<div>Most delays clear within a few hours. You don’t need to do anything — we’ll notify you when ${esc(bank)} confirms.</div></div>`; actions=`<button class="btn secondary" data-act="help">Get help</button><button class="btn ghost" data-act="goHome">Back to home</button>`; }
  if (st==='uncertain'){ next = 'Nu confirms with '+bank; note = `<div class="note warn">${I.alert}<div><b>Please don’t send this again.</b> The money may already be on its way. We’re checking with ${esc(bank)} and will tell you what happened and what to do next.</div></div>`; actions=`<button class="btn secondary" data-act="help">Get help</button><button class="btn ghost" data-act="goHome">Back to home</button>`; }
  if (st==='returned'){ next = 'You: check details with '+fn; note = `<div class="note neutral">${I.info}<div>This usually means the account details didn’t match. Check them with ${fn} before sending again.</div></div>`; actions=`<button class="btn primary" data-act="help">Get help</button><button class="btn ghost" data-act="downloadConf">Download confirmation (PDF)</button>`; }
  if (st==='completed'){ const cx = allContacts().find(x=>x.name===t.recipient.name && x.country===t.country);
    actions=`<button class="btn primary" data-act="sGo" data-arg="receipt">${I.receipt} View receipt</button>${cx && !isTrusted(cx.name,cx.country)?`<button class="btn ghost" data-act="openContact" data-arg="${cx.id}">Skip Face ID next time for ${esc(fn)}</button>`:`<button class="btn ghost" data-act="goHome">Done</button>`}`; }
  return `<div class="scr">${hdr({back:false, title:'', right:`<button class="ib" data-act="goHome" aria-label="Close">${I.close}</button>`})}
    <div class="body">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px">
        ${badge}
        ${journey(t, fn)}
        <h1 class="title" style="margin:0">${head}</h1>
        <p class="lead" style="margin:0 0 6px">${sub}</p>
        ${st==='completed' && t.realMs>=1000 ? `<span class="tag green" style="margin-top:2px">${I.clock} Delivered in ${Math.round(t.realMs/1000)} seconds</span>` : ''}
      </div>
      ${next ? `<div class="card" style="margin:12px 0"><div class="kv"><span class="k">Next</span><span class="v">${esc(next)}</span></div><div class="kv"><span class="k">Transfer ID</span><span class="v">${t.id}</span></div></div>`:''}
      ${note}
      <div class="eyebrow">Status</div>
      <div class="tl">${tl_}</div>
    </div>
    <div class="foot">${actions}</div></div>`;
},

function homeItems(){
